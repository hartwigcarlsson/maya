name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      # rustup installerar verktygskedjan och wasm32-målet ur rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Samma version som i Dockerfile. Förbyggd binär, inget kompilerat i CI.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos@0.3.11
      # cargo-leptos hämtar wasm-bindgen-cli i den version som Cargo.lock pinnar.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-leptos
          key: cargo-leptos-0.3.11-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-leptos-0.3.11-${{ runner.os }}-
      - name: Taggen är versionen i Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "maya") | .version')
          test "v$version" = "$GITHUB_REF_NAME" \
            || { echo "::error::taggen $GITHUB_REF_NAME men Cargo.toml har $version"; exit 1; }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: domain kompilerar till WASM
        run: cargo build -p maya-domain --target wasm32-unknown-unknown --locked
      # Hydreringens WASM, JS och CSS i target/site. Webbläsartesterna (rok, hydrering,
      # klientnavigering) kör mot den och misslyckas i CI (CI=true) om den saknas, i stället
      # för att hoppa över sig själva. Servern byggs med samma flaggor, så cargo test bygger
      # inte om den.
      - name: Sajten (cargo leptos build)
        run: cargo leptos build
      # ubuntu-latest har Google Chrome; headless_chrome hittar den på PATH.
      - run: cargo test --workspace --locked

  image:
    needs: test
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Plattformens namn
        run: echo "PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bygg (och publicera per digest för en versionstagg)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ env.PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PAIR }}
          outputs: ${{ startsWith(github.ref, 'refs/tags/v') && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
      - name: Spara digesten
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: digests-${{ env.PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Semver-taggar ur git-taggen; aldrig latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Sätt ihop amd64 och arm64 under taggarna
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046 # orddelningen ger ett argument per tagg och digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
