[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
maya-domain = { path = "crates/domain" }
maya-core = { path = "crates/core" }
maya-web = { path = "crates/web" }
maya-auth = { path = "crates/auth" }
maya-sie = { path = "crates/sie" }
maya-pdf = { path = "crates/pdf" }

axum = "0.8"
calamine = "0.36"
clap = { version = "4", features = ["derive"] }
console_error_panic_hook = "0.1"
dotenvy = "0.15"
getrandom = "0.3"
hayro-cmap = "0.1"
hayro-interpret = "0.7"
hayro-syntax = "0.7"
headless_chrome = "1.0.22"
hex = "0.4"
http-body-util = "0.1"
ipnet = "2"
jiff = { version = "0.2", default-features = false, features = ["std", "static"] }
kurbo = "0.13"
leptos = "0.8"
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rust-embed = { version = "8", features = ["interpolate-folder-path", "mime-guess"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Typst är 0.x och bryter API:t mellan minor-versioner; uppgradering är eget arbete (#65).
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
url = "2"
wasm-bindgen = "=0.2.129"
webauthn-rs = "0.5"
web-sys = { version = "0.3", features = ["HtmlButtonElement", "HtmlFormElement", "HtmlInputElement", "MediaQueryList", "Storage"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"

[[workspace.metadata.leptos]]
name = "maya"
bin-package = "maya"
lib-package = "maya-web"
output-name = "maya"
site-pkg-dir = "pkg"
style-file = "crates/web/style/maya.css"
assets-dir = "crates/web/public"
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
# I debugläge bygger cargo-leptos annars med `--cfg erase_components`, som ändrar SSR-markupen.
# Ett vanligt `cargo build`/`cargo test` bygger om servern utan den, och då panikar WASM:en
# vid hydreringen ("expected a marker node"). Samma flaggor överallt.
disable-erase-components = true

# Typst och PDF-skrivningen är mycket långsammare utan optimering; kontoplanen (BAS, över tusen
# konton) tog ~20 s i debugläge. Bara de tunga craterna optimeras, så resten byggs som förut.
[profile.dev.package]
comemo = { opt-level = 2 }
hayro-interpret = { opt-level = 2 }
hayro-syntax = { opt-level = 2 }
krilla = { opt-level = 2 }
rustybuzz = { opt-level = 2 }
subsetter = { opt-level = 2 }
ttf-parser = { opt-level = 2 }
typst-eval = { opt-level = 2 }
typst-layout = { opt-level = 2 }
typst-library = { opt-level = 2 }
typst-pdf = { opt-level = 2 }
typst-realize = { opt-level = 2 }
typst-syntax = { opt-level = 2 }
