[package]
name = "maya-core"
description = "Enda vägen in till Mayas data (ADR 0003): användningsfall, sqlx och migreringar."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Hjälpmedel för tester i andra crates: `Databas::tillfällig()` och `Klocka::fast()`.
test-support = ["dep:tempfile"]

[dependencies]
maya-domain.workspace = true
maya-sie.workspace = true
maya-pdf.workspace = true
getrandom.workspace = true
hex.workspace = true
ipnet.workspace = true
jiff = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ureq.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
maya-pdf = { workspace = true, features = ["test-support"] }
maya-core = { path = ".", features = ["test-support"] }
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
