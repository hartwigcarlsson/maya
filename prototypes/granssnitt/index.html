<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maya gränssnittsprototyp</title>
<!--
  PROTOTYP, KASTA BORT. Svarar på: Hur ska Mayas gränssnitt se ut och navigeras?
  (https://github.com/hartwigcarlsson/maya/issues/24)
  Stil: shadcn/ui-presetet b1Gdz9bFY (Mira, Stone, Amber, Inter, Lucide, liten radie).
  Tre skal som skiljer sig i grunden, valda med ?variant=A|B|C (eller ← → / knapparna längst ned).
  A: Sidomeny   B: Inkorg först   C: Tangentbord och kommandopalett
  Allt ligger i minnet; ladda om sidan för att börja om.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* Tokens från presetet (Stone + Amber), ljust */
:root{
  --background:oklch(1 0 0);--foreground:oklch(0.147 0.004 49.25);
  --card:oklch(1 0 0);--popover:oklch(1 0 0);
  --primary:oklch(0.555 0.163 48.998);--primary-foreground:oklch(0.987 0.022 95.277);
  --secondary:oklch(0.967 0.001 286.375);--secondary-foreground:oklch(0.21 0.006 285.885);
  --muted:oklch(0.97 0.001 106.424);--muted-foreground:oklch(0.553 0.013 58.071);
  --accent:oklch(0.97 0.001 106.424);--accent-foreground:oklch(0.216 0.006 56.043);
  --destructive:oklch(0.577 0.245 27.325);
  --border:oklch(0.923 0.003 48.717);--input:oklch(0.923 0.003 48.717);--ring:oklch(0.709 0.01 56.259);
  --sidebar:oklch(0.985 0.001 106.423);--sidebar-primary:oklch(0.666 0.179 58.318);--sidebar-accent:oklch(0.97 0.001 106.424);--sidebar-border:oklch(0.923 0.003 48.717);
  --success:oklch(0.52 0.12 150);
  --radius:0.45rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --background:oklch(0.147 0.004 49.25);--foreground:oklch(0.985 0.001 106.423);
  --card:oklch(0.216 0.006 56.043);--popover:oklch(0.216 0.006 56.043);
  --primary:oklch(0.473 0.137 46.201);--primary-foreground:oklch(0.987 0.022 95.277);
  --secondary:oklch(0.274 0.006 286.033);--secondary-foreground:oklch(0.985 0 0);
  --muted:oklch(0.268 0.007 34.298);--muted-foreground:oklch(0.709 0.01 56.259);
  --accent:oklch(0.268 0.007 34.298);--accent-foreground:oklch(0.985 0.001 106.423);
  --destructive:oklch(0.704 0.191 22.216);
  --border:oklch(1 0 0 / 10%);--input:oklch(1 0 0 / 15%);--ring:oklch(0.553 0.013 58.071);
  --sidebar:oklch(0.216 0.006 56.043);--sidebar-primary:oklch(0.769 0.188 70.08);--sidebar-accent:oklch(0.268 0.007 34.298);--sidebar-border:oklch(1 0 0 / 10%);
  --success:oklch(0.75 0.13 150);
}}
:root[data-theme="dark"]{
  --background:oklch(0.147 0.004 49.25);--foreground:oklch(0.985 0.001 106.423);
  --card:oklch(0.216 0.006 56.043);--popover:oklch(0.216 0.006 56.043);
  --primary:oklch(0.473 0.137 46.201);--primary-foreground:oklch(0.987 0.022 95.277);
  --secondary:oklch(0.274 0.006 286.033);--secondary-foreground:oklch(0.985 0 0);
  --muted:oklch(0.268 0.007 34.298);--muted-foreground:oklch(0.709 0.01 56.259);
  --accent:oklch(0.268 0.007 34.298);--accent-foreground:oklch(0.985 0.001 106.423);
  --destructive:oklch(0.704 0.191 22.216);
  --border:oklch(1 0 0 / 10%);--input:oklch(1 0 0 / 15%);--ring:oklch(0.553 0.013 58.071);
  --sidebar:oklch(0.216 0.006 56.043);--sidebar-primary:oklch(0.769 0.188 70.08);--sidebar-accent:oklch(0.268 0.007 34.298);--sidebar-border:oklch(1 0 0 / 10%);
  --success:oklch(0.75 0.13 150);
}
*{box-sizing:border-box;border-color:var(--border)}
html,body{margin:0;height:100%}
body{background:var(--background);color:var(--foreground);font:12px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.lucide{width:14px;height:14px;flex-shrink:0;stroke-width:2}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mf{color:var(--muted-foreground)}
h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:14px;font-weight:500;margin:0}

/* Button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:28px;padding:0 8px;border-radius:calc(var(--radius) * .8);font-size:12px;font-weight:500;border:1px solid transparent;cursor:pointer;white-space:nowrap;background:transparent;transition:background .1s}
.btn-default{background:var(--primary);color:var(--primary-foreground)}
.btn-default:hover{background:color-mix(in oklch,var(--primary) 90%,transparent)}
.btn-outline{border-color:var(--input);background:var(--background)}
:root[data-theme="dark"] .btn-outline{background:color-mix(in oklch,var(--input) 30%,transparent)}
.btn-outline:hover,.btn-ghost:hover{background:var(--accent)}
.btn-secondary{background:var(--secondary);color:var(--secondary-foreground)}
.btn-icon{width:28px;padding:0}
.btn-destructive-ghost{color:var(--destructive)}
.btn-destructive-ghost:hover{background:color-mix(in oklch,var(--destructive) 10%,transparent)}

/* Badge */
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:500;white-space:nowrap;border:1px solid transparent;vertical-align:middle}
.badge svg.lucide{width:10px;height:10px}
.badge-utkast{background:color-mix(in oklch,var(--primary) 14%,transparent);color:var(--sidebar-primary)}
.badge-bokford{background:var(--secondary);color:var(--secondary-foreground)}
.badge-ai{border-color:var(--border);color:var(--foreground)}
.badge-rattad{background:color-mix(in oklch,var(--destructive) 12%,transparent);color:var(--destructive)}
.badge-count{background:var(--primary);color:var(--primary-foreground);height:18px;min-width:18px;padding:0 5px;justify-content:center}

/* Card */
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 0 0 1px color-mix(in oklch,var(--foreground) 10%,transparent);display:flex;flex-direction:column;gap:16px;padding:16px 0}
.card-header{padding:0 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-title{font-size:14px;font-weight:500}
.card-desc{color:var(--muted-foreground)}
.card-content{padding:0 16px}
.card-footer{padding:0 16px;display:flex;gap:8px;justify-content:flex-end;align-items:center}

/* Input */
.input{height:28px;border:1px solid var(--input);border-radius:calc(var(--radius) * .8);padding:0 8px;background:transparent;font-size:12px;width:100%}
:root[data-theme="dark"] .input{background:color-mix(in oklch,var(--input) 30%,transparent)}
.input:focus,.cell:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklch,var(--ring) 50%,transparent)}
.input[readonly]{background:var(--muted);color:var(--muted-foreground)}
.label{font-size:12px;font-weight:500;display:block;margin-bottom:6px}
.field-grid{display:grid;grid-template-columns:160px 1fr 1fr;gap:16px}

/* Table */
table{border-collapse:collapse;width:100%}
.table th{height:32px;padding:0 8px;text-align:left;font-weight:500;color:var(--muted-foreground);border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tbody tr:last-child td{border-bottom:0}
.table tr.click{cursor:pointer}
.table tr.click:hover td{background:color-mix(in oklch,var(--muted) 50%,transparent)}
.cell{width:100%;height:28px;border:1px solid transparent;border-radius:calc(var(--radius) * .8);padding:0 6px;background:transparent}
.cell:hover:not([readonly]){border-color:var(--input)}
.rows td{padding:2px 4px}
.sumrow td{font-weight:600;border-top:1px solid var(--border);padding:8px}
.diff-bad{color:var(--destructive);display:inline-flex;gap:4px;align-items:center}
.diff-ok{color:var(--success);display:inline-flex;gap:4px;align-items:center}

/* Alert */
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:start;border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;background:var(--card)}
.alert .t{font-weight:500}
.alert ul{margin:2px 0 0 16px;padding:0;color:var(--muted-foreground)}
.alert.destructive{color:var(--destructive)}
.alert.destructive ul{color:color-mix(in oklch,var(--destructive) 85%,var(--foreground))}
.alert.ok{color:var(--success)}

/* Tabs */
.tabs{display:inline-flex;background:var(--muted);border-radius:var(--radius);padding:3px;gap:2px}
.tabs button{height:22px;padding:0 10px;border:0;border-radius:calc(var(--radius) * .7);background:transparent;color:var(--muted-foreground);font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{background:var(--background);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.08)}
:root[data-theme="dark"] .tabs button.on{background:var(--input)}

/* Dropdown */
.dropdown{position:absolute;z-index:20;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;min-width:240px}
.dropdown .lbl{padding:6px 8px;color:var(--muted-foreground);font-size:11px}
.dropdown .mi{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;background:transparent;border-radius:calc(var(--radius) * .8);cursor:pointer;text-align:left}
.dropdown .mi:hover{background:var(--accent)}
.dropdown .sepl{height:1px;background:var(--border);margin:4px -4px}
.logo{width:28px;height:28px;border-radius:calc(var(--radius) * .8);background:var(--sidebar-primary);color:var(--primary-foreground);display:grid;place-items:center;font-weight:700;flex-shrink:0}
.logo.sm{width:22px;height:22px;font-size:11px;background:var(--muted);color:var(--foreground);border:1px solid var(--border)}
kbd{font:500 10px Inter,system-ui;border:1px solid var(--border);border-radius:4px;padding:1px 5px;background:var(--muted);color:var(--muted-foreground)}
.placeholder{display:grid;place-items:center;gap:8px;padding:64px;color:var(--muted-foreground);text-align:center;border:1px dashed var(--border);border-radius:var(--radius)}

/* ---------- Switcher (inte en del av designen) ---------- */
#proto-switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:999;display:flex;align-items:center;gap:6px;
  background:#111;color:#fff;border-radius:999px;padding:6px 8px;box-shadow:0 6px 24px rgba(0,0,0,.35);font:12px system-ui;border:2px dashed #f5c400}
#proto-switcher button{background:#333;color:#fff;border:0;border-radius:999px;padding:4px 10px;cursor:pointer}
#proto-switcher .lbl{padding:0 8px;white-space:nowrap}

/* ---------- Variant A: Sidomeny (shadcn sidebar-07) ---------- */
.A{display:grid;grid-template-columns:240px 1fr;height:100vh}
.A aside{background:var(--sidebar);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;padding:8px;gap:8px;overflow:auto}
.A .switch{position:relative}
.A .switch>button{display:flex;align-items:center;gap:8px;width:100%;padding:6px;border:0;background:transparent;border-radius:var(--radius);cursor:pointer;text-align:left}
.A .switch>button:hover{background:var(--sidebar-accent)}
.A .switch .nm{font-weight:600;line-height:1.2}
.A .switch .sub{color:var(--muted-foreground);font-size:11px}
.A .grp{display:flex;flex-direction:column;gap:1px}
.A .grp-l{height:28px;display:flex;align-items:center;padding:0 8px;color:var(--muted-foreground);font-size:11px;font-weight:500}
.A .grp a{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:calc(var(--radius) * .8)}
.A .grp a:hover{background:var(--sidebar-accent)}
.A .grp a.on{background:var(--sidebar-accent);font-weight:500}
.A .grp a .badge{margin-left:auto}
.A .user{margin-top:auto;display:flex;align-items:center;gap:8px;padding:6px}
.A .avatar{width:28px;height:28px;border-radius:calc(var(--radius) * .8);background:var(--muted);display:grid;place-items:center;font-weight:600;font-size:11px}
.A .inset{display:flex;flex-direction:column;min-width:0;overflow:auto}
.A .topbar{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--background);z-index:5}
.A .topbar .vsep{width:1px;height:16px;background:var(--border);margin:0 4px}
.A .crumbs{display:flex;align-items:center;gap:6px;color:var(--muted-foreground)}
.A .crumbs b{color:var(--foreground);font-weight:400}
.A .content{padding:16px 24px 90px;display:flex;flex-direction:column;gap:16px;max-width:1100px}
.A .phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

/* ---------- Variant B: Inkorg först ---------- */
.B{display:flex;flex-direction:column;height:100vh}
.B header{display:flex;align-items:center;gap:12px;padding:0 12px;height:48px;border-bottom:1px solid var(--border);background:var(--background)}
.B .brand{display:flex;align-items:center;gap:8px;font-weight:600}
.B .co{position:relative}
.B .co .dropdown{top:34px;left:0}
.B nav{display:flex;gap:2px}
.B nav a{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:calc(var(--radius) * .8);color:var(--muted-foreground);font-weight:500}
.B nav a:hover{color:var(--foreground);background:var(--accent)}
.B nav a.on{color:var(--foreground);background:var(--accent)}
.B header .right{margin-left:auto;display:flex;gap:4px;align-items:center}
.B .split{flex:1;display:grid;grid-template-columns:360px 1fr;min-height:0}
.B .list{border-right:1px solid var(--border);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--sidebar)}
.B .list .lh{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 8px}
.B .sect{display:flex;align-items:center;gap:6px;color:var(--muted-foreground);font-size:11px;font-weight:500;padding:10px 4px 2px}
.B .item{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:calc(var(--radius) * .8);border:1px solid transparent;background:color-mix(in oklch,var(--muted) 50%,transparent)}
.B .item:hover{background:var(--muted)}
.B .item.on{border-color:var(--ring);background:var(--card)}
.B .item .top{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.B .item .meta{display:flex;gap:6px;align-items:center;color:var(--muted-foreground);flex-wrap:wrap}
.B .item.plain{background:transparent;border-color:var(--border)}
.B .detail{overflow:auto;padding:20px 28px 90px;display:flex;flex-direction:column;gap:16px}
.B .empty{display:grid;place-items:center;height:100%;color:var(--muted-foreground);text-align:center;gap:8px}

/* ---------- Variant C: Tangentbord och kommandopalett ---------- */
.C{display:flex;flex-direction:column;height:100vh}
.C .crumb{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-bottom:1px solid var(--border);color:var(--muted-foreground)}
.C .crumb a.co{display:inline-flex;align-items:center;gap:6px;color:var(--foreground);padding:2px 6px;border-radius:calc(var(--radius) * .8)}
.C .crumb a.co:hover{background:var(--accent)}
.C .crumb .cur{color:var(--foreground)}
.C .crumb .k{margin-left:auto;display:flex;gap:4px;align-items:center}
.C .search{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 8px;min-width:240px;border:1px solid var(--input);border-radius:calc(var(--radius) * .8);color:var(--muted-foreground);cursor:pointer;background:color-mix(in oklch,var(--muted) 50%,transparent)}
.C .search kbd{margin-left:auto}
.C .body{flex:1;overflow:auto;padding:12px 16px 90px}
.C .j th{position:sticky;top:0;background:var(--background);z-index:1}
.C .j tbody.v{border-bottom:1px solid var(--border)}
.C .j tbody.v td{border:0;padding:3px 8px}
.C .j tbody.v tr:first-child td{padding-top:8px}
.C .j tbody.v tr:last-child td{padding-bottom:8px}
.C .j tbody.v:hover td{background:color-mix(in oklch,var(--muted) 50%,transparent);cursor:pointer}
.C .j tbody.v.sel td{background:var(--muted)}
.C .j tbody.v.sel td:first-child{box-shadow:inset 2px 0 0 var(--sidebar-primary)}
.C .j td.r{color:var(--muted-foreground)}
.C .status{display:flex;gap:16px;align-items:center;height:28px;padding:0 12px;border-top:1px solid var(--border);color:var(--muted-foreground);font-size:11px}
.C .status .warn{color:var(--sidebar-primary);font-weight:500;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.C .pal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:flex-start;padding-top:14vh;z-index:50}
.C .pal{width:520px;max-width:92vw;background:var(--popover);border-radius:var(--radius);box-shadow:0 0 0 1px color-mix(in oklch,var(--foreground) 10%,transparent),0 16px 48px rgba(0,0,0,.4);overflow:hidden}
.C .pal .in{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);color:var(--muted-foreground)}
.C .pal input{flex:1;height:40px;border:0;background:transparent;outline:none;font-size:12px;color:var(--foreground)}
.C .pal .ls{max-height:340px;overflow:auto;padding:4px}
.C .pal .opt{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:calc(var(--radius) * .8);cursor:pointer}
.C .pal .opt.on{background:var(--accent)}
.C .pal .opt kbd{margin-left:auto}
.C .pal .grp{padding:8px 8px 4px;font-size:11px;color:var(--muted-foreground);font-weight:500}
.C .pal .ft{display:flex;gap:12px;padding:6px 12px;border-top:1px solid var(--border);color:var(--muted-foreground);font-size:11px}
.C .form{max-width:880px;display:flex;flex-direction:column;gap:12px}
.C .form .hdr{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;align-items:center}
.C .hint{color:var(--muted-foreground);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="proto-switcher"></div>
<script>
/* ================= Data (i minnet) ================= */
const IDAG = new Date('2026-10-13T10:00:00');
const LAST_TOM = '2026-08'; // perioder t.o.m. augusti är låsta
const KONTON = {
  1510:'Kundfordringar',1930:'Företagskonto',2440:'Leverantörsskulder',2611:'Utgående moms 25 %',2641:'Debiterad ingående moms',

};
const ANV = 'Anna Berg';
const FORETAG = [
  {id:'exempel',namn:'Exempel AB',orgnr:'559999-9991',ar:'2026-01-01 – 2026-12-31'},
  {id:'lund',namn:'Konsultbolaget i Lund AB',orgnr:'559888-1234',ar:'2025-07-01 – 2026-06-30'},

let seq=100;
function r(konto,d,k){return {konto:String(konto),debet:d?String(d):'',kredit:k?String(k):''}}
function v(o){return Object.assign({id:'v'+(seq++),underlag:0,rader:[]},o)}
const VER = {
  exempel:[
    v({nr:1,datum:'2026-01-02',beskrivning:'Hyra januari, Fastighets AB Kvarnen',bokford:'2026-01-03 09:12',skapatAv:ANV,kanal:'webb',underlag:1,rader:[r(5010,12000),r(2641,3000),r(1930,0,15000)]}),
    v({nr:2,datum:'2026-01-15',beskrivning:'Kundfaktura 1001, Norrsken Design AB',bokford:'2026-01-15 14:40',skapatAv:ANV,kanal:'webb',underlag:1,rader:[r(1510,50000),r(3041,0,40000),r(2611,0,10000)]}),
    v({nr:3,datum:'2026-09-25',beskrivning:'Lön september',bokford:'2026-09-25 08:01',skapatAv:ANV,kanal:'webb',rader:[r(7210,42000),r(7510,13196.4),r(2710,0,11340),r(2731,0,13196.4),r(1930,0,30660)]}),
    v({nr:4,datum:'2026-09-30',beskrivning:'Bankavgift september',bokford:'2026-10-01 07:55',skapatAv:ANV,kanal:'MCP',godkandAv:ANV,underlag:1,rader:[r(6570,95),r(1930,0,95)]}),

// [nyckel, namn, Lucide-ikon, grupp]
const MODULER = [
  ['oversikt','Översikt','layout-dashboard','Bokföring'],['verifikat','Verifikat','notebook-pen','Bokföring'],['underlag','Underlag','paperclip','Bokföring'],
  ['kundfakturor','Kundfakturor','file-output','Flöden'],['leverantorsfakturor','Leverantörsfakturor','file-input','Flöden'],['lon','Lön','banknote','Flöden'],['moms','Moms','percent','Flöden'],
  ['rapporter','Rapporter','chart-column','Uppföljning'],['installningar','Inställningar','settings','Uppföljning'],
];
const ic=(n,extra)=>`<i data-lucide="${n}"${extra?' '+extra:''}></i>`;

/* ================= Tillstånd ================= */
const params = new URLSearchParams(location.search);
const S = {variant:(params.get('variant')||'A').toUpperCase(), co:'exempel', filter:'alla', errors:[], form:null, coMenu:false, pal:false, palQ:'', palI:0, sel:0, flash:''};
const co = ()=>FORETAG.find(f=>f.id===S.co);
const lista = ()=>VER[S.co];
const utkast = ()=>lista().filter(x=>x.nr==null);
function route(){const h=(location.hash||'#/verifikat').slice(2).split('/');return {mod:h[0]||'verifikat',id:h[1]||null}}
function go(h){location.hash=h}
const initialer=s=>s.split(/\s+/).filter(w=>w!=='AB'&&w!=='i').slice(0,2).map(w=>w[0]).join('').toUpperCase();

/* ================= Hjälpare ================= */
const fmt = new Intl.NumberFormat('sv-SE',{minimumFractionDigits:2,maximumFractionDigits:2});
const n = s=>{const x=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isNaN(x)?0:x};
const kr = x=>x?fmt.format(x):'';
const sum = (rader,f)=>rader.reduce((a,x)=>a+n(x[f]),0);
const belopp = x=>Math.max(sum(x.rader,'debet'),sum(x.rader,'kredit'));
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function alder(d){const days=Math.round((IDAG-new Date(d+'T10:00:00'))/864e5);return days<=0?'i dag':days===1?'1 dag':days+' dagar'}
function vnr(x){return x.nr==null?'–':'V'+x.nr}
function status(x){
  if(x.nr==null) return `<span class="badge badge-utkast">${ic('pencil-line')}Utkast</span>`;
  if(x.rattadAv) return `<span class="badge badge-rattad">Rättad av V${x.rattadAv}</span>`;
  if(x.rattelseAv) return `<span class="badge badge-bokford">${ic('undo-2')}Rättelse av V${x.rattelseAv}</span>`;
  return `<span class="badge badge-bokford">${ic('lock')}Bokförd</span>`;
}
const aiTag = x=>x.kanal==='MCP'?`<span class="badge badge-ai" title="Skapat av ${esc(x.skapatAv)} via AI (MCP)">${ic('sparkles')}AI</span>`:'';
function filtrerad(){const l=lista().slice();const f=S.filter;
  const out=f==='utkast'?l.filter(x=>x.nr==null):f==='bokforda'?l.filter(x=>x.nr!=null):l;
  return out.sort((a,b)=>(b.nr==null)-(a.nr==null)||(b.nr??0)-(a.nr??0)||b.datum.localeCompare(a.datum));}
const modNamn=k=>MODULER.find(m=>m[0]===k)?.[1]||'';

/* ================= Verifikatformulär (delad logik) ================= */
function oppnaForm(id){
  const x=id&&id!=='ny'?lista().find(y=>y.id===id):null;
  if(S.form&&S.form._for===(id||'ny'))return;
  S.errors=[];
  S.form=x?{_for:id,id:x.id,nr:x.nr,datum:x.datum,beskrivning:x.beskrivning,rader:x.rader.map(y=>({...y})),kanal:x.kanal,skapatAv:x.skapatAv,underlag:x.underlag,ro:x.nr!=null,src:x}
         :{_for:'ny',id:null,nr:null,datum:IDAG.toISOString().slice(0,10),beskrivning:'',rader:[r('',0,0),r('',0,0)],kanal:'webb',skapatAv:ANV,underlag:0,ro:false};
}
function setF(k,v){S.form[k]=v}
function setR(i,k,v){S.form.rader[i][k]=v;if(k==='konto')render(true);else uppdateraSummor()}
function laggTillRad(){S.form.rader.push(r('',0,0));render()}
function uppdateraSummor(){
  const d=sum(S.form.rader,'debet'),k=sum(S.form.rader,'kredit'),diff=Math.round((d-k)*100)/100;
  document.querySelectorAll('[data-sum=d]').forEach(e=>e.textContent=fmt.format(d));
  document.querySelectorAll('[data-sum=k]').forEach(e=>e.textContent=fmt.format(k));
  document.querySelectorAll('[data-sum=diff]').forEach(e=>{e.innerHTML=diff===0?ic('circle-check')+'Balanserar':ic('circle-alert')+'Differens '+fmt.format(diff);e.className=diff===0?'diff-ok':'diff-bad'});
  window.lucide&&lucide.createIcons();
}
function spar(){
  const f=S.form;const rader=f.rader.filter(x=>x.konto||x.debet||x.kredit);
  if(f.id){const x=lista().find(y=>y.id===f.id);Object.assign(x,{datum:f.datum,beskrivning:f.beskrivning,rader});return x}
  const x=v({nr:null,datum:f.datum,beskrivning:f.beskrivning,skapat:IDAG.toISOString().slice(0,10),skapatAv:ANV,kanal:'webb',rader});
  lista().push(x);return x;
}
function sparaUtkast(){const x=spar();S.form=null;S.flash='Utkastet sparades.';go('#/'+route().mod+'/'+x.id)}
function bokfor(){
  const f=S.form,e=[];const rader=f.rader.filter(x=>x.konto||n(x.debet)||n(x.kredit));
  if(rader.length<2)e.push('Minst två rader behövs.');
  if(Math.round((sum(rader,'debet')-sum(rader,'kredit'))*100)!==0)e.push('Debet och kredit balanserar inte.');
  if(rader.some(x=>!KONTON[x.konto]))e.push('Varje rad behöver ett aktivt konto i kontoplanen.');
  if(!f.beskrivning.trim())e.push('Beskrivning saknas.');
  if(!f.datum)e.push('Verifikatdatum saknas.');
  else if(f.datum.slice(0,7)<=LAST_TOM)e.push('Perioden '+f.datum.slice(0,7)+' är låst. Välj ett datum i en öppen period.');
  S.errors=e;if(e.length){render();return}
  const x=spar();x.nr=Math.max(0,...lista().map(y=>y.nr||0))+1;x.bokford='2026-10-13 10:'+String(10+x.nr).padStart(2,'0');x.godkandAv=x.kanal==='MCP'?ANV:undefined;
  S.form=null;S.flash='Bokförd som V'+x.nr+'.';go('#/'+(route().mod==='inkorg'?'verifikat':route().mod)+'/'+x.id);
}
function radera(){const f=S.form;VER[S.co]=lista().filter(y=>y.id!==f.id);S.form=null;S.flash='';go('#/'+route().mod)}
function byt(id){S.co=id;S.form=null;S.coMenu=false;S.flash='';go('#/'+(S.variant==='B'?'inkorg':'verifikat'));render()}

function radTabell(f){
  const ro=f.ro?'readonly':'';
  return `<table class="table rows"><thead><tr><th style="width:96px">Konto</th><th>Kontonamn</th><th class="num" style="width:140px">Debet</th><th class="num" style="width:140px">Kredit</th></tr></thead><tbody>
  ${f.rader.map((x,i)=>`<tr><td><input class="cell" ${ro} value="${esc(x.konto)}" oninput="setR(${i},'konto',this.value)" placeholder="Konto"></td>
    <td class="mf">${esc(KONTON[x.konto]||(x.konto?'Okänt konto':''))}</td>
    <td><input class="cell num" ${ro} value="${esc(x.debet&&kr(n(x.debet)))}" oninput="setR(${i},'debet',this.value)"></td>
    <td><input class="cell num" ${ro} value="${esc(x.kredit&&kr(n(x.kredit)))}" oninput="setR(${i},'kredit',this.value)"></td></tr>`).join('')}
  <tr class="sumrow"><td colspan="2"><span data-sum="diff"></span></td><td class="num" data-sum="d"></td><td class="num" data-sum="k"></td></tr></tbody></table>`;
}
const errBox=()=>S.errors.length?`<div class="alert destructive">${ic('circle-alert')}<div><div class="t">Kan inte bokföra</div><ul>${S.errors.map(e=>'<li>'+esc(e)+'</li>').join('')}</ul></div></div>`:'';
const flashBox=()=>S.flash?`<div class="alert ok">${ic('circle-check')}<div class="t">${esc(S.flash)}</div></div>`:'';
function skapadRad(f){
  if(!f.src&&!f.id)return 'Nytt verifikat';
  const x=f.src||lista().find(y=>y.id===f.id);
  let s='Skapat av '+esc(x.skapatAv)+(x.kanal==='MCP'?' via AI':'');
  if(x.nr!=null)s+=' · bokfört '+esc(x.bokford)+(x.godkandAv?' av '+esc(x.godkandAv):'');
  else s+=' · utkast i '+alder(x.skapat);
  return s;
}
const underlagTxt=f=>f.underlag?`<span style="display:inline-flex;gap:6px;align-items:center">${ic('paperclip')}kvitto.pdf</span>`:'<span class="mf">Inget underlag</span>';
function knappar(f,ordning){
  if(f.ro)return `<button class="btn btn-outline">${ic('undo-2')}Rätta…</button>`;
  const b={bokfor:`<button class="btn btn-default" onclick="bokfor()">${ic('lock')}Bokför</button>`,
    spara:`<button class="btn btn-outline" onclick="sparaUtkast()">${ic('save')}Spara utkast</button>`,
    radera:f.id?`<button class="btn btn-destructive-ghost" onclick="radera()">${ic('trash-2')}Radera utkast</button>`:''};
  return ordning.map(k=>b[k]).join('');
}
function coMenu(cls){
  return `<div class="dropdown ${cls||''}"><div class="lbl">Företag</div>${FORETAG.map(f=>`<button class="mi" onclick="byt('${f.id}')"><span class="logo sm">${initialer(f.namn)}</span><span style="flex:1"><b style="font-weight:500">${esc(f.namn)}</b><br><span class="mf">${f.orgnr} · ${VER[f.id].filter(x=>x.nr==null).length} utkast</span></span>${f.id===S.co?ic('check'):''}</button>`).join('')}
  <div class="sepl"></div><button class="mi mf">${ic('plus')}Lägg till företag</button></div>`;
}

  const u=utkast().length;let g='',nav='';

    </div></div></div>
    <div class="card"><div class="card-header"><div><div class="card-title">Rader</div><div class="card-desc">Debet och kredit måste balansera för att bokföra.</div></div>${f.ro?'':`<button class="btn btn-outline" onclick="laggTillRad()">${ic('plus')}Rad</button>`}</div>
      <div class="card-content">${radTabell(f)}</div></div>`;
  }
  const rows=filtrerad().map(x=>`<tr class="click" onclick="go('#/verifikat/${x.id}')"><td class="num" style="text-align:left;font-weight:500">${vnr(x)}</td><td class="num" style="text-align:left">${x.datum}</td><td>${esc(x.beskrivning)}</td><td><span style="display:inline-flex;gap:4px">${status(x)}${aiTag(x)}</span></td><td class="mf">${x.nr==null?alder(x.skapat):''}</td><td class="num">${kr(belopp(x))}</td><td class="mf">${x.underlag?ic('paperclip'):''}</td></tr>`).join('');
  const cnt=k=>k==='utkast'?utkast().length:k==='bokforda'?lista().length-utkast().length:lista().length;
  return `<div class="phead"><div><h1>Verifikat</h1><div class="mf" style="margin-top:4px">Räkenskapsår ${co().ar} · perioder t.o.m. ${LAST_TOM} är låsta</div></div><button class="btn btn-default" onclick="go('#/verifikat/ny')">${ic('plus')}Nytt verifikat</button></div>
    ${u?`<div class="alert">${ic('inbox')}<div><div class="t">${u} utkast väntar på att bokföras</div><div class="mf">Det äldsta skapades för ${alder(utkast().map(x=>x.skapat).sort()[0])} sedan.</div></div><button class="btn btn-outline" onclick="S.filter='utkast';render()">Visa utkast</button></div>`:''}
    <div><div class="tabs">${[['alla','Alla'],['utkast','Utkast'],['bokforda','Bokförda']].map(([k,t])=>`<button class="${S.filter===k?'on':''}" onclick="S.filter='${k}';render()">${t} <span class="mf">${cnt(k)}</span></button>`).join('')}</div></div>

}};

      <div>${radTabell(f)}${f.ro?'':`<button class="btn btn-ghost" onclick="laggTillRad()">${ic('plus')}Rad</button>`}</div>
      ${errBox()}
      <div style="display:flex;gap:8px">${knappar(f,['bokfor','spara','radera'])}</div></div>`;
  }
  return `<div class="split"><div class="list">${list}</div>${det}</div>`;
}};

/* ================= Variant C: Tangentbord och kommandopalett ================= */
const C={namn:'Tangentbord',render(rt){
  const u=utkast().length;
  return `<div class="C"><div class="crumb"><span class="logo" style="width:22px;height:22px;font-size:11px">M</span>${ic('slash')}<a href="#" class="co" onclick="palett('företag');return false">${esc(co().namn)}${ic('chevrons-up-down')}</a>${ic('slash')}<span class="${rt.id?'':'cur'}">${modNamn(rt.mod)}</span>${rt.id?`${ic('slash')}<span class="cur">${rt.id==='ny'?'Nytt':esc(vnr(lista().find(x=>x.id===rt.id)||{nr:null}))}</span>`:''}
    <span class="k"><span class="search" onclick="palett()">${ic('search')}Sök eller gå till…<kbd>⌘K</kbd></span><button class="btn btn-ghost btn-icon" onclick="tema()">${ic('sun-moon')}</button></span></div>
    <div class="body">${C.page(rt)}</div>
    <div class="status"><span>${co().orgnr}</span><span>Räkenskapsår ${co().ar}</span><span>${ic('lock','style="width:11px;height:11px;vertical-align:-1px"')} t.o.m. ${LAST_TOM}</span>
      ${u?`<span class="warn" onclick="S.filter='utkast';go('#/verifikat')">${ic('circle-dot','style="width:11px;height:11px"')}${u} utkast väntar</span>`:''}
      <span style="margin-left:auto;display:flex;gap:10px"><span><kbd>N</kbd> nytt</span><span><kbd>J</kbd><kbd>K</kbd> flytta</span><span><kbd>↵</kbd> öppna</span><span><kbd>⌘↵</kbd> bokför</span></span></div>
    ${S.pal?C.pal():''}</div>`;
},page(rt){
  if(rt.mod!=='verifikat')return `<div class="placeholder">${ic('construction')}Sidan prototypas senare på det här skalet.<span>Tryck <kbd>⌘K</kbd> för att byta sida.</span></div>`;
  if(rt.id){oppnaForm(rt.id);const f=S.form;
    return `<div class="form">${flashBox()}
      <div class="hdr"><span class="mf">Status</span><span style="display:flex;gap:6px;align-items:center">${f.src?status(f.src)+aiTag(f.src):'<span class="badge badge-utkast">Nytt</span>'}<span class="mf">${skapadRad(f)}</span></span>
      <span class="mf">Verifikatdatum</span><input type="date" class="input" style="width:160px" ${f.ro?'readonly':''} value="${f.datum}" onchange="setF('datum',this.value)">
      <span class="mf">Beskrivning</span><input class="input" ${f.ro?'readonly':''} value="${esc(f.beskrivning)}" oninput="setF('beskrivning',this.value)">
      <span class="mf">Underlag</span><span>${underlagTxt(f)}</span></div>
      ${radTabell(f)}${errBox()}
      <div class="hint">${f.ro?'<span><kbd>R</kbd> rätta</span><span><kbd>Esc</kbd> tillbaka</span>':'<span><kbd>Tab</kbd> nästa cell</span><span><kbd>⌥↵</kbd> ny rad</span><span><kbd>⌘S</kbd> spara utkast</span><span><kbd>⌘↵</kbd> bokför</span><span><kbd>Esc</kbd> tillbaka</span>'}</div></div>`;
  }
  const l=filtrerad();S.sel=Math.max(0,Math.min(S.sel,l.length-1));
  return `<div style="margin-bottom:8px;display:flex;gap:8px;align-items:center"><h1>Grundbok</h1><div class="tabs" style="margin-left:8px">${[['alla','Alla'],['utkast','Utkast'],['bokforda','Bokförda']].map(([k,t])=>`<button class="${S.filter===k?'on':''}" onclick="S.filter='${k}';render()">${t}</button>`).join('')}</div></div>
  <table class="table j"><thead><tr><th style="width:56px">Nr</th><th style="width:96px">Datum</th><th style="width:64px">Konto</th><th>Text</th><th class="num" style="width:120px">Debet</th><th class="num" style="width:120px">Kredit</th></tr></thead>
  ${l.map((x,i)=>`<tbody class="v ${i===S.sel?'sel':''}" onclick="go('#/verifikat/${x.id}')">
    <tr><td style="font-weight:600">${vnr(x)}</td><td class="num" style="text-align:left">${x.datum}</td><td></td><td><span style="display:inline-flex;gap:6px;align-items:center"><b style="font-weight:500">${esc(x.beskrivning)}</b>${x.nr==null?status(x)+aiTag(x)+'<span class="mf">'+alder(x.skapat)+'</span>':(x.rattadAv||x.rattelseAv?status(x):'')}</span></td><td></td><td></td></tr>
    ${x.rader.map(y=>`<tr><td></td><td></td><td class="r num" style="text-align:left">${y.konto}</td><td class="r">${esc(KONTON[y.konto]||'')}</td><td class="num">${kr(n(y.debet))}</td><td class="num">${kr(n(y.kredit))}</td></tr>`).join('')}</tbody>`).join('')}</table>`;
},opts(){
  const q=S.palQ.toLowerCase();
  const o=[{g:'Förslag',t:'Utkast att bokföra ('+utkast().length+')',i:'inbox',run:()=>{S.filter='utkast';go('#/verifikat')}},
    {g:'Förslag',t:'Nytt verifikat',i:'plus',k:'N',run:()=>go('#/verifikat/ny')},
    ...MODULER.map(([k,t,i])=>({g:'Gå till',t,i,run:()=>go('#/'+k)})),
    ...FORETAG.filter(f=>f.id!==S.co).map(f=>({g:'Byt företag',t:f.namn,i:'building-2',run:()=>byt(f.id)})),
    ...lista().map(x=>({g:'Verifikat',t:(x.nr?'V'+x.nr:'Utkast')+' · '+x.beskrivning,i:x.nr?'file-lock':'file-pen',run:()=>go('#/verifikat/'+x.id)}))];
  return o.filter(x=>!q||x.t.toLowerCase().includes(q)||x.g.toLowerCase().includes(q)).slice(0,14);
},pal(){
  const o=C.opts();let g='';
  return `<div class="pal-bg" onclick="if(event.target===this){S.pal=false;render()}"><div class="pal"><div class="in">${ic('search')}<input id="palq" placeholder="Sök sida, företag, verifikat…" value="${esc(S.palQ)}" oninput="S.palQ=this.value;S.palI=0;render();const e=document.getElementById('palq');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div>
    <div class="ls">${o.map((x,i)=>{const h=x.g!==g?(g=x.g,`<div class="grp">${x.g}</div>`):'';return h+`<div class="opt ${i===S.palI?'on':''}" onclick="C.run(${i})">${ic(x.i)}<span>${esc(x.t)}</span>${x.k?`<kbd>${x.k}</kbd>`:''}</div>`}).join('')||'<div class="opt mf">Inga träffar.</div>'}</div>
    <div class="ft"><span><kbd>↑</kbd><kbd>↓</kbd> välj</span><span><kbd>↵</kbd> öppna</span><span><kbd>Esc</kbd> stäng</span></div></div></div>`;
},run(i){const o=C.opts()[i];S.pal=false;S.palQ='';o&&o.run();render()}};
function palett(q){S.pal=true;S.palQ=q||'';S.palI=0;render();setTimeout(()=>document.getElementById('palq')?.focus())}

/* ================= Render, tema, tangenter ================= */
const VARIANTS={A,B,C};
function render(keepFocus){
  const a=document.activeElement,idx=keepFocus&&a?[...document.querySelectorAll('input')].indexOf(a):-1;
  const V=VARIANTS[S.variant]||A;
  document.getElementById('app').innerHTML=V.render(route());
  if(S.form)uppdateraSummor();
  window.lucide&&lucide.createIcons();
  if(idx>=0){const e=document.querySelectorAll('input')[idx];if(e){e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch{}}}
  const keys=Object.keys(VARIANTS);
  document.getElementById('proto-switcher').innerHTML=`<button onclick="cyk(-1)">←</button><span class="lbl">PROTOTYP · ${S.variant} (${V.namn}) · ${keys.indexOf(S.variant)+1}/${keys.length}</span><button onclick="cyk(1)">→</button>`;
}
function cyk(d){const k=Object.keys(VARIANTS);S.variant=k[(k.indexOf(S.variant)+d+k.length)%k.length];S.coMenu=false;S.pal=false;
  const p=new URLSearchParams(location.search);p.set('variant',S.variant);history.replaceState(null,'','?'+p+location.hash);render()}
function tema(){const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'}
window.addEventListener('hashchange',()=>{const rt=route();S.coMenu=false;if(!rt.id){S.form=null;S.errors=[]}else if(S.form&&S.form._for!==rt.id){S.form=null}render();S.flash=''});
document.addEventListener('click',e=>{if(S.coMenu&&!e.target.closest('.switch,.co')){S.coMenu=false;render()}});
document.addEventListener('keydown',e=>{
  const typing=e.target.matches('input,textarea,select,[contenteditable]');
  const mod=e.metaKey||e.ctrlKey;
  if(S.variant==='C'){
    if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();S.pal?(S.pal=false,render()):palett();return}
    if(S.pal){const o=C.opts();
      if(e.key==='Escape'){S.pal=false;render()}
      else if(e.key==='ArrowDown'){e.preventDefault();S.palI=Math.min(S.palI+1,o.length-1);render();document.getElementById('palq').focus()}
      else if(e.key==='ArrowUp'){e.preventDefault();S.palI=Math.max(S.palI-1,0);render();document.getElementById('palq').focus()}
      else if(e.key==='Enter'){e.preventDefault();C.run(S.palI)}
      return}
    const rt=route();
    if(rt.id&&S.form&&!S.form.ro){
      if(mod&&e.key==='Enter'){e.preventDefault();bokfor();return}
      if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();sparaUtkast();return}
      if(e.altKey&&e.key==='Enter'){e.preventDefault();laggTillRad();return}
    }
    if(e.key==='Escape'&&rt.id){go('#/verifikat');return}
    if(!typing&&!mod&&rt.mod==='verifikat'&&!rt.id){
      const l=filtrerad();
      if(e.key==='j'){S.sel=Math.min(S.sel+1,l.length-1);render();return}
      if(e.key==='k'){S.sel=Math.max(S.sel-1,0);render();return}
      if(e.key==='Enter'){go('#/verifikat/'+l[S.sel].id);return}
      if(e.key==='n'){go('#/verifikat/ny');return}
    }
  }
  if(typing)return;
  if(e.key==='ArrowLeft')cyk(-1);
  if(e.key==='ArrowRight')cyk(1);
});
render();
</script>
</body>
