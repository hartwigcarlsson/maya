<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maya lönekörning</title>
<!--
  PROTOTYP, KASTA BORT. Svarar på: Hur ser lönekörningen ut i gränssnittet?
  (https://github.com/hartwigcarlsson/maya/issues/45). Flödet är beslutat i #21.
  Bygger på skalet i variant D av gränssnittsprototypen (#24) och mönstren från verifikat (#32),
  leverantörsfakturor (#43) och kundfakturor (#44): lista och detalj, paneler i dokumentet, rutan "Bokförs som",
  spärrar vid fältet och en inaktiv huvudknapp som visar antal kvar.
  Tre varianter, ?variant=A|B|C (eller ← → / knapparna längst ned). Data, beräkning, AGI och anställda är gemensamma;
  varianterna skiljer sig i hur lönekörningen redigeras och hur månaden hänger ihop:
  A: Tabell över alla anställda, en rad per person som fälls ut   B: En anställd i taget, med lönespecen bredvid
  C: Månaden som kedja: lönekörningar → bokföring → AGI → skatt på en sida
  Allt ligger i minnet; ladda om sidan för att börja om. I dag är 2026-10-14. Perioder t.o.m. juni är låsta.
  Skattetabellen, engångsskatten och avgiftssatserna är förenklade och bara illustrativa; formen på beräkningen är poängen.
  Exempel AB: oktoberkörningen är ett AI-utkast, slutlönen för Jonas är fastställd och utbetald men obokförd,
  augusti rättades efter att AGI lämnats. Konsultbolaget i Lund: ingen lön i september, så nolldeklarationen är försenad.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* Tokens från presetet (Stone + Amber), ljust */
:root{
  --background:oklch(1 0 0);--foreground:oklch(0.147 0.004 49.25);
  --card:oklch(1 0 0);--popover:oklch(1 0 0);
  --primary:oklch(0.555 0.163 48.998);--primary-foreground:oklch(0.987 0.022 95.277);
  --secondary:oklch(0.967 0.001 286.375);--secondary-foreground:oklch(0.21 0.006 285.885);
  --muted:oklch(0.97 0.001 106.424);--muted-foreground:oklch(0.553 0.013 58.071);
  --accent:oklch(0.97 0.001 106.424);--accent-foreground:oklch(0.216 0.006 56.043);
  --destructive:oklch(0.577 0.245 27.325);
  --border:oklch(0.923 0.003 48.717);--input:oklch(0.923 0.003 48.717);--ring:oklch(0.709 0.01 56.259);
  --sidebar:oklch(0.985 0.001 106.423);--sidebar-primary:oklch(0.666 0.179 58.318);--sidebar-accent:oklch(0.97 0.001 106.424);--sidebar-border:oklch(0.923 0.003 48.717);
  --success:oklch(0.52 0.12 150);
  --radius:0.45rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --background:oklch(0.147 0.004 49.25);--foreground:oklch(0.985 0.001 106.423);
  --card:oklch(0.216 0.006 56.043);--popover:oklch(0.216 0.006 56.043);
  --primary:oklch(0.473 0.137 46.201);--primary-foreground:oklch(0.987 0.022 95.277);
  --secondary:oklch(0.274 0.006 286.033);--secondary-foreground:oklch(0.985 0 0);
  --muted:oklch(0.268 0.007 34.298);--muted-foreground:oklch(0.709 0.01 56.259);
  --accent:oklch(0.268 0.007 34.298);--accent-foreground:oklch(0.985 0.001 106.423);
  --destructive:oklch(0.704 0.191 22.216);
  --border:oklch(1 0 0 / 10%);--input:oklch(1 0 0 / 15%);--ring:oklch(0.553 0.013 58.071);
  --sidebar:oklch(0.216 0.006 56.043);--sidebar-primary:oklch(0.769 0.188 70.08);--sidebar-accent:oklch(0.268 0.007 34.298);--sidebar-border:oklch(1 0 0 / 10%);
  --success:oklch(0.75 0.13 150);
}}
:root[data-theme="dark"]{
  --background:oklch(0.147 0.004 49.25);--foreground:oklch(0.985 0.001 106.423);
  --card:oklch(0.216 0.006 56.043);--popover:oklch(0.216 0.006 56.043);
  --primary:oklch(0.473 0.137 46.201);--primary-foreground:oklch(0.987 0.022 95.277);
  --secondary:oklch(0.274 0.006 286.033);--secondary-foreground:oklch(0.985 0 0);
  --muted:oklch(0.268 0.007 34.298);--muted-foreground:oklch(0.709 0.01 56.259);
  --accent:oklch(0.268 0.007 34.298);--accent-foreground:oklch(0.985 0.001 106.423);
  --destructive:oklch(0.704 0.191 22.216);
  --border:oklch(1 0 0 / 10%);--input:oklch(1 0 0 / 15%);--ring:oklch(0.553 0.013 58.071);
  --sidebar:oklch(0.216 0.006 56.043);--sidebar-primary:oklch(0.769 0.188 70.08);--sidebar-accent:oklch(0.268 0.007 34.298);--sidebar-border:oklch(1 0 0 / 10%);
  --success:oklch(0.75 0.13 150);
}
*{box-sizing:border-box;border-color:var(--border)}
html,body{margin:0;height:100%}
body{background:var(--background);color:var(--foreground);font:13px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.lucide{width:14px;height:14px;flex-shrink:0;stroke-width:2}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mf{color:var(--muted-foreground)}
h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:14px;font-weight:500;margin:0}

/* Button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:28px;padding:0 8px;border-radius:calc(var(--radius) * .8);font-size:13px;font-weight:500;border:1px solid transparent;cursor:pointer;white-space:nowrap;background:transparent;transition:background .1s}
.btn-default{background:var(--primary);color:var(--primary-foreground)}
.btn-default:hover{background:color-mix(in oklch,var(--primary) 90%,transparent)}
.btn-outline{border-color:var(--input);background:var(--background)}
:root[data-theme="dark"] .btn-outline{background:color-mix(in oklch,var(--input) 30%,transparent)}
.btn-outline:hover,.btn-ghost:hover{background:var(--accent)}
.btn-secondary{background:var(--secondary);color:var(--secondary-foreground)}
.btn-icon{width:28px;padding:0}
.btn-destructive-ghost{color:var(--destructive)}
.btn-destructive-ghost:hover{background:color-mix(in oklch,var(--destructive) 10%,transparent)}

/* Badge */
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:500;white-space:nowrap;border:1px solid transparent;vertical-align:middle}
.badge svg.lucide{width:10px;height:10px}
.badge-utkast{border:1px dashed var(--muted-foreground);color:var(--muted-foreground)}
.badge-bokford{background:var(--secondary);color:var(--secondary-foreground)}
.badge-ai{border-color:var(--border);color:var(--foreground)}
.badge-rattad{background:color-mix(in oklch,var(--destructive) 12%,transparent);color:var(--destructive)}
.badge-count{background:var(--primary);color:var(--primary-foreground);height:18px;min-width:18px;padding:0 5px;justify-content:center}

/* Card */
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 0 0 1px color-mix(in oklch,var(--foreground) 10%,transparent);display:flex;flex-direction:column;gap:16px;padding:16px 0}
.card-header{padding:0 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-title{font-size:14px;font-weight:500}
.card-desc{color:var(--muted-foreground)}
.card-content{padding:0 16px}
.card-footer{padding:0 16px;display:flex;gap:8px;justify-content:flex-end;align-items:center}

/* Input */
.input{height:28px;border:1px solid var(--input);border-radius:calc(var(--radius) * .8);padding:0 8px;background:transparent;font-size:13px;width:100%}
:root[data-theme="dark"] .input{background:color-mix(in oklch,var(--input) 30%,transparent)}
.input:focus,.cell:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklch,var(--ring) 50%,transparent)}
.input[readonly]{background:var(--muted);color:var(--muted-foreground)}
.label{font-size:13px;font-weight:500;display:block;margin-bottom:6px}
.field-grid{display:grid;grid-template-columns:160px 1fr 1fr;gap:16px}

/* Table */
table{border-collapse:collapse;width:100%}
.table th{height:32px;padding:0 8px;text-align:left;font-weight:500;color:var(--muted-foreground);border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tbody tr:last-child td{border-bottom:0}
.table tr.click{cursor:pointer}
.table tr.click:hover td{background:color-mix(in oklch,var(--muted) 50%,transparent)}
.cell{width:100%;height:28px;border:1px solid transparent;border-radius:calc(var(--radius) * .8);padding:0 6px;background:transparent}
.cell:hover:not([readonly]){border-color:var(--input)}
.rows td{padding:2px 4px}
.sumrow td{font-weight:600;border-top:1px solid var(--border);padding:8px}
.diff-bad{color:var(--destructive);display:inline-flex;gap:4px;align-items:center}
.diff-ok{color:var(--success);display:inline-flex;gap:4px;align-items:center}

/* Alert */
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:start;border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;background:var(--card)}
.alert .t{font-weight:500}
.alert ul{margin:2px 0 0 16px;padding:0;color:var(--muted-foreground)}
.alert.destructive{color:var(--destructive)}
.alert.destructive ul{color:color-mix(in oklch,var(--destructive) 85%,var(--foreground))}
.alert.ok{color:var(--success)}

/* Tabs */
.tabs{display:inline-flex;background:var(--muted);border-radius:var(--radius);padding:3px;gap:2px}
.tabs button{height:22px;padding:0 10px;border:0;border-radius:calc(var(--radius) * .7);background:transparent;color:var(--muted-foreground);font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{background:var(--background);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.08)}
:root[data-theme="dark"] .tabs button.on{background:var(--input)}

/* Dropdown */
.dropdown{position:absolute;z-index:20;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;min-width:240px}
.dropdown .lbl{padding:6px 8px;color:var(--muted-foreground);font-size:11px}
.dropdown .mi{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;background:transparent;border-radius:calc(var(--radius) * .8);cursor:pointer;text-align:left}
.dropdown .mi:hover{background:var(--accent)}
.dropdown .sepl{height:1px;background:var(--border);margin:4px -4px}
.logo{width:28px;height:28px;border-radius:calc(var(--radius) * .8);background:var(--sidebar-primary);color:var(--primary-foreground);display:grid;place-items:center;font-weight:700;flex-shrink:0}
.logo.sm{width:22px;height:22px;font-size:11px;background:var(--muted);color:var(--foreground);border:1px solid var(--border)}
kbd{font:500 10px Inter,system-ui;border:1px solid var(--border);border-radius:4px;padding:1px 5px;background:var(--muted);color:var(--muted-foreground)}
.placeholder{display:grid;place-items:center;gap:8px;padding:64px;color:var(--muted-foreground);text-align:center;border:1px dashed var(--border);border-radius:var(--radius)}

/* ---------- Switcher (inte en del av designen) ---------- */
#proto-switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:999;display:flex;align-items:center;gap:6px;
  background:#111;color:#fff;border-radius:999px;padding:6px 8px;box-shadow:0 6px 24px rgba(0,0,0,.35);font:12px system-ui;border:2px dashed #f5c400}
#proto-switcher button{background:#333;color:#fff;border:0;border-radius:999px;padding:4px 10px;cursor:pointer}
#proto-switcher .lbl{padding:0 8px;white-space:nowrap}

/* ---------- Variant B: Inkorg först ---------- */
.B{display:flex;flex-direction:column;height:100vh}
.B header{display:flex;align-items:center;gap:12px;padding:0 12px;height:48px;border-bottom:1px solid var(--border);background:var(--background)}
.B .brand{display:flex;align-items:center;gap:8px;font-weight:600}
.B .co{position:relative}
.B .co .dropdown{top:34px;left:0}
.B nav{display:flex;gap:2px}
.B nav a{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:calc(var(--radius) * .8);color:var(--muted-foreground);font-weight:500}
.B nav a:hover{color:var(--foreground);background:var(--accent)}
.B nav a.on{color:var(--foreground);background:var(--accent)}
.B header .right{margin-left:auto;display:flex;gap:4px;align-items:center}
.B .split{flex:1;display:grid;grid-template-columns:360px 1fr;min-height:0}
.B .list{border-right:1px solid var(--border);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--sidebar)}
.B .list .lh{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 8px}
.B .sect{display:flex;align-items:center;gap:6px;color:var(--muted-foreground);font-size:11px;font-weight:500;padding:10px 4px 2px}
.B .item{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:calc(var(--radius) * .8);border:1px solid transparent;background:color-mix(in oklch,var(--muted) 50%,transparent)}
.B .item:hover{background:var(--muted)}
.B .item.on{border-color:var(--ring);background:var(--card)}
.B .item .top{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.B .item .meta{display:flex;gap:6px;align-items:center;color:var(--muted-foreground);flex-wrap:wrap}
.B .item.plain{background:transparent;border-color:var(--border)}
.B .detail{overflow:auto;padding:20px 28px 90px;display:flex;flex-direction:column;gap:16px}
.B .empty{display:grid;place-items:center;height:100%;color:var(--muted-foreground);text-align:center;gap:8px}

.search{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 8px;min-width:240px;border:1px solid var(--input);border-radius:calc(var(--radius) * .8);color:var(--muted-foreground);cursor:pointer;background:color-mix(in oklch,var(--muted) 50%,transparent)}
.search kbd{margin-left:auto}
.pal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:flex-start;padding-top:14vh;z-index:50}
.pal{width:520px;max-width:92vw;background:var(--popover);border-radius:var(--radius);box-shadow:0 0 0 1px color-mix(in oklch,var(--foreground) 10%,transparent),0 16px 48px rgba(0,0,0,.4);overflow:hidden}
.pal .in{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);color:var(--muted-foreground)}
.pal input{flex:1;height:40px;border:0;background:transparent;outline:none;font-size:13px;color:var(--foreground)}
.pal .ls{max-height:340px;overflow:auto;padding:4px}
.pal .opt{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:calc(var(--radius) * .8);cursor:pointer}
.pal .opt.on{background:var(--accent)}
.pal .opt kbd,.pal .opt .amt{margin-left:auto}
.pal .opt .amt{color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.pal .opt .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal .grp{padding:8px 8px 4px;font-size:11px;color:var(--muted-foreground);font-weight:500}
.pal .ft{display:flex;gap:12px;padding:6px 12px;border-top:1px solid var(--border);color:var(--muted-foreground);font-size:11px}

/* ---------- Gemensamt för verifikatprototypen ---------- */
.B .detail{position:relative}
.warn{color:var(--sidebar-primary)}
.badge-warn{background:color-mix(in oklch,var(--sidebar-primary) 14%,transparent);color:var(--sidebar-primary)}
.badge-lock{background:var(--muted);color:var(--muted-foreground);border-color:var(--border)}
.dl{display:grid;grid-template-columns:130px 1fr;gap:6px 16px}
.dl dt{color:var(--muted-foreground)}
.dl dd{margin:0}
.link{text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.sec-t{font-size:11px;font-weight:500;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.paper{background:var(--card);border-radius:var(--radius);box-shadow:0 0 0 1px color-mix(in oklch,var(--foreground) 10%,transparent),0 2px 8px rgba(0,0,0,.04);padding:24px 28px;display:flex;flex-direction:column;gap:20px;max-width:860px}
.ro td{padding:6px 8px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:grid;grid-template-columns:18px 130px 1fr;gap:8px;align-items:start}
.hist li .t{color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.ufile{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:calc(var(--radius) * .8)}
.ufile .mf{margin-left:auto;font-size:11px}
.ufile.kompl{border-style:dashed}
.preview{display:grid;place-items:center;gap:6px;background:var(--muted);color:var(--muted-foreground);border-radius:var(--radius);text-align:center}
.drop{display:grid;place-items:center;gap:6px;border:1px dashed var(--ring);border-radius:var(--radius);color:var(--muted-foreground);padding:16px;text-align:center}
.err .input,.input.err{border-color:var(--destructive)}
tr.err td{background:color-mix(in oklch,var(--destructive) 6%,transparent)}
.cell.err{border-color:var(--destructive)}
.ferr{color:var(--destructive);font-size:11px;margin-top:3px;display:flex;gap:4px;align-items:center}
.ferr svg.lucide{width:11px;height:11px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.dialog{width:560px;max-width:94vw;background:var(--popover);border-radius:var(--radius);box-shadow:0 0 0 1px color-mix(in oklch,var(--foreground) 10%,transparent),0 16px 48px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px;padding:18px 20px}
.dialog .ft{display:flex;gap:8px;justify-content:flex-end}
.pick{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.pick label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:calc(var(--radius) * .8);border:1px solid var(--border);cursor:pointer}
.pick label:hover{background:var(--accent)}
.note{display:flex;gap:8px;align-items:flex-start;color:var(--muted-foreground);font-size:12px}
.note svg.lucide{margin-top:2px}
.flex{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}

/* A: kontrollista i en högerspalt */
.A-edit{display:grid;grid-template-columns:1fr 250px;gap:24px;align-items:start}
.rail{position:sticky;top:0;display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--sidebar)}
.rail .chk{display:grid;grid-template-columns:16px 1fr;gap:6px;align-items:start}
.rail .chk.ok{color:var(--muted-foreground)}
.rail .chk.bad{color:var(--foreground)}
.rail .chk.bad svg.lucide{color:var(--destructive)}
.rail .chk.ok svg.lucide{color:var(--success)}
.rail .chk .fix{display:block;font-size:11px;color:var(--muted-foreground)}

/* B: tabell som lista */
.tlist{width:100%;border-collapse:collapse}
.tlist td{padding:6px 6px;border-bottom:1px solid var(--border);vertical-align:top}
.tlist tr{cursor:pointer}
.tlist tr:hover td{background:var(--muted)}
.tlist tr.on td{background:var(--card);box-shadow:inset 0 0 0 0 var(--ring)}
.tlist tr.on td:first-child{box-shadow:inset 2px 0 0 var(--sidebar-primary)}
.tlist th{font-weight:500;color:var(--muted-foreground);text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);font-size:11px}
.B .list.wide{padding:8px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cmp .paper{padding:16px}

/* C: underlag bredvid */
.C-edit{display:grid;grid-template-columns:minmax(260px,42%) 1fr;gap:20px;align-items:start}
.C-edit .left{position:sticky;top:0;display:flex;flex-direction:column;gap:8px}
.C-edit .left .preview{height:420px}
.per{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--muted-foreground);padding:12px 4px 2px}
.per .badge{margin-left:auto}
.pop{position:absolute;z-index:20;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px;width:300px;display:flex;flex-direction:column;gap:6px}
.inl{border:1px solid var(--ring);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--card)}
.bcount{background:color-mix(in oklch,var(--primary-foreground) 25%,transparent);border-radius:999px;padding:0 6px;font-size:11px}
/* ---------- Leverantörsfakturor ---------- */
.badge-obetald{background:var(--secondary);color:var(--secondary-foreground)}
.badge-forfallen{background:color-mix(in oklch,var(--destructive) 12%,transparent);color:var(--destructive)}
.badge-betald{background:color-mix(in oklch,var(--success) 14%,transparent);color:var(--success)}

function prorata(a,p){const d=dagarIMan(p),start=p+'-01',slut=p+'-'+d;let fr=1,ti=d;

function calc(k,a){

/* ================= Handlingar ================= */
function inteHar(t){S.flash=t+' prototypas i ett annat ticket.';render()}
function setRad(kid,aid,i,f,v){const r=hittaK(kid).rader[aid][i];r[f]=['ftyp','konto','text','datum','fran','underlag'].includes(f)?v:v;render(true)}
function nyRad(kid,aid,t){if(!t)return;const a=hittaA(aid),r={t};
  if(t==='tim')Object.assign(r,{antal:'',apris:a.belopp});if(t==='forman')Object.assign(r,{ftyp:'ovrig',belopp:''});if(t==='utlagg')Object.assign(r,{text:'',belopp:'',moms:'',konto:'6110',underlag:''});
  if(t==='vab'||t==='foraldra')Object.assign(r,{datum:'',dagar:1,omf:100});if(t==='arvode')r.belopp=a.typ==='styrelse'?a.belopp:'';if(t==='sjuk')Object.assign(r,{fran:'',dagar:''});if(t==='semester')r.dagar='';
  hittaK(kid).rader[aid].push(r);render()}
function taBortRad(kid,aid,i){hittaK(kid).rader[aid].splice(i,1);render()}
function laggTill(kid,aid){const k=hittaK(kid),a=hittaA(aid);k.rader[aid]=standardRader(a);k.historik.push(h(nu(),ANV,'La till '+a.namn,'user-plus'));S.emp=aid;S.open[aid]=true;render()}
function taBortAnst(kid,aid){const k=hittaK(kid);delete k.rader[aid];k.historik.push(h(nu(),ANV,'Tog bort '+hittaA(aid).namn+' ur lönekörningen','user-minus'));if(S.emp===aid)S.emp=null;render()}
const standardRader=a=>a.typ==='manad'?[{t:'manad'}]:a.typ==='timme'?[{t:'tim',antal:'',apris:a.belopp}]:[{t:'arvode',belopp:a.belopp}];
const aktiva=p=>anst().filter(a=>!(a.slut&&a.slut<p+'-01')&&a.anst<=p+'-31');
function faststall(kid){const k=hittaK(kid),p=S.panel,tid=nu();k.status='faststalld';k.specar.forEach(s=>s.ersatt=true);
  const ver=k.specar.length+1,skickad={};if(p.skicka)deltagare(k).forEach(a=>{if(a.epost)skickad[a.id]=tid});
  k.specar.push({ver,tid,ersatt:false,skickad});k.historik.push(h(tid,ANV,`Fastställde. Lönespecifikationer v${ver} skapade${ver>1?` och ersätter v${ver-1}`:''}${p.skicka?' och skickade':''}`,'lock'));
  S.panel=null;S.flash=`Lönekörningen är fastställd. ${deltagare(k).length} lönespecifikationer (v${ver}) skapade${p.skicka?' och skickade':''}.`+(kanBokforas(k)?'':` Den kan bokföras från ${dkort(k.utbet)}.`);render()}
function oppnaIgen(kid){const k=hittaK(kid);k.status='utkast';k.historik.push(h(nu(),ANV,'Öppnade lönekörningen igen. Lönespecifikationerna gäller tills den fastställs på nytt','lock-open'));S.panel=null;S.flash='Lönekörningen är ett utkast igen.';render()}
function bokfor(kid){const k=hittaK(kid),c=co();c.vnr++;k.ver.push({typ:'Lönekörning',nr:c.vnr,datum:k.utbet});k.status='bokford';
  k.historik.push(h(nu(),ANV,`Bokförde som V${c.vnr} med verifikatdatum ${k.utbet}`,'stamp'));const ag=AGI[S.co][k.period];if(ag&&ag.lamnad){ag.andrad=IDAG_S}
  S.panel=null;S.flash=`Bokförd som V${c.vnr} · ${dkort(k.utbet)}.`+(ag&&ag.lamnad?` AGI för ${manad(k.period)} är redan lämnad; lämna en ny fil.`:'');nastaEfter();render()}
function ratta(kid){const k=hittaK(kid),p=S.panel,c=co(),gammal=[...k.ver].reverse().find(v=>v.typ==='Lönekörning');
  if(p.hur==='om'){c.vnr++;k.ver.push({typ:'Rättelse av V'+gammal.nr,nr:c.vnr,datum:IDAG_S});k.status='faststalld';
    k.historik.push(h(nu(),ANV,`Rättade V${gammal.nr} med V${c.vnr}${p.orsak?' (orsak: '+p.orsak+')':''}. Lönekörningen blev fastställd igen`,'undo-2'));
    const ag=AGI[S.co][k.period];if(ag&&ag.lamnad)ag.andrad=IDAG_S;S.panel=null;S.flash=`V${gammal.nr} är vänt med V${c.vnr}. Öppna lönekörningen igen för att ändra den.`}
  else{const a=hittaA(p.aid);let mal=kor().find(x=>x.status==='utkast'&&x.typ==='ordinarie'&&x.period>k.period);
    if(!mal){mal=K({period:nastaMan(IDAG_S.slice(0,7)),utbet:nastaMan(IDAG_S.slice(0,7))+'-25'});kor().unshift(mal)}
    mal.rader[a.id]=mal.rader[a.id]||standardRader(a);mal.rader[a.id].push({t:'korr',text:p.text||('Rättelse '+kTitel(k).toLowerCase()),belopp:p.belopp});
    k.historik.push(h(nu(),ANV,`Korrigering ${kr(n(p.belopp))} kr för ${a.namn} lagd i ${kTitel(mal)}`,'arrow-right'));S.panel=null;S.flash=`Korrigeringsraden ligger i ${kTitel(mal)}.`}
  render()}
function radera(kid){KOR[S.co]=kor().filter(k=>k.id!==kid);S.panel=null;S.flash='Utkastet raderades.';go('#/lon')}
function skapaKorning(){const p=S.panel;const ny=K({typ:p.typ,namn:p.typ==='extra'?(p.namn||'Extra lönekörning'):'',period:p.utbet.slice(0,7),utbet:p.utbet});
  p.valda.forEach(id=>ny.rader[id]=standardRader(hittaA(id)));ny.historik.push(h(nu(),ANV,'Skapade lönekörningen','plus'));kor().unshift(ny);S.panel=null;go(S.variant==='C'?'#/lon/m-'+ny.period:'#/lon/'+ny.id)}
function skapaXml(p){S.xml=p;const i=agiInfo(p);S.flash=`agi_${co().orgnr.replace('-','')}_${p.replace('-','')}.xml är skapad och validerad mot XSD 1.1${i.noll?' (nolldeklaration)':''}.`;agi(p).fil=nu();render()}
function lamna(p){const ag=agi(p),d=S.panel.datum;ag.lamnad=d;delete ag.andrad;ag.iu=agiInfo(p).iu.map(u=>u.a.id);S.panel=null;S.flash=`AGI för ${manad(p)} är markerad som lämnad ${d}.`;nastaEfter();render()}
function betalaSkatt(p){const c=co();c.vnr++;SKATT[S.co][p]={nr:c.vnr,datum:S.panel.datum};S.panel=null;S.flash=`Betalningen till skattekontot är bokförd som V${c.vnr}.`;render()}
function nastaEfter(){if(route().mod!=='inkorg')return;const x=attGora().flatMap(([, , l])=>l)[0];S.flash+=x?'':' Inget kvar att göra för lön.';go('#/inkorg'+(x?'/'+x.id:''))}
function sparaAnst(aid){const a=hittaA(aid),e=S.edit,ch=[];
  Object.entries(e.v).forEach(([f,v])=>{const gam=f==='tabell'||f==='kol'||f==='belopp'?String(a[f]??''):a[f]??'';if(String(v)!==String(gam)){ch.push(`${FALT[f]} ${gam||'—'} → ${v||'—'}`);a[f]=['tabell','kol','belopp'].includes(f)?(v===''?null:+v):v}});
  if(ch.length)a.hist.unshift({tid:e.fran,t:ch.join('; ')+', gäller från '+e.fran,v:ANV});S.edit=null;S.flash=ch.length?'Ändringen är sparad och loggad.':'Inget ändrades.';render()}
const FALT={belopp:'Lön',tabell:'Skattetabell',kol:'Kolumn',giltig:'Skattebeslut gäller t.o.m.',bank:'Bankkonto',epost:'E-post',slut:'Slutdatum',adress:'Adress'};

/* ================= Gemensamma byggstenar ================= */
function ferrRad(c,i){return c.fel.filter(e=>e.i===i).map(e=>`<div class="ferr">${ic('circle-alert')}<span>${esc(e.t)}</span></div>`).join('')}
function falt(k,a,i,f,val,w,typ){const ro=k.status!=='utkast';return `<input class="cell ${typ==='num'?'num':''}" style="width:${w||90}px" ${ro?'readonly':''} value="${esc(val??'')}" onchange="setRad('${k.id}','${a.id}',${i},'${f}',this.value)">`}
function radFalt(k,a,r,i){const ro=k.status!=='utkast',sel=(f,o,v)=>`<select class="cell" style="width:auto" ${ro?'disabled':''} onchange="setRad('${k.id}','${a.id}',${i},'${f}',this.value)">${o.map(([x,t])=>`<option value="${x}" ${x===v?'selected':''}>${t}</option>`).join('')}</select>`;
  switch(r.t){
    case 'manad':{const pr=prorata(a,k.period);return `<span class="mf">${kr(a.belopp)} kr/mån från registret${pr.f<1?` · ${pr.dgr} av ${pr.tot} dagar`:''}</span>`}
    case 'tim':return `${falt(k,a,i,'antal',r.antal,60,'num')} h × ${falt(k,a,i,'apris',r.apris,70,'num')} kr`;
    case 'semester':return `${falt(k,a,i,'dagar',r.dagar,50,'num')} dagar <span class="mf">· saldo ${a.sem.saldo} betalda dagar</span>`;
    case 'sjuk':return `från ${falt(k,a,i,'fran',r.fran,100)} ${falt(k,a,i,'dagar',r.dagar,50,'num')} dagar`;
    case 'vab':case 'foraldra':return `${falt(k,a,i,'datum',r.datum,100)} ${falt(k,a,i,'dagar',r.dagar,44,'num')} dagar × ${falt(k,a,i,'omf',r.omf,50,'num')} %`;
    case 'forman':return `${sel('ftyp',Object.entries(FTYP).map(([x,v])=>[x,v[0]]),r.ftyp)} värde ${falt(k,a,i,'belopp',r.belopp,80,'num')} kr/mån`;
    case 'utlagg':return `${falt(k,a,i,'text',r.text,140)} ${falt(k,a,i,'belopp',r.belopp,70,'num')} kr, varav moms ${falt(k,a,i,'moms',r.moms,60,'num')} ${sel('konto',['5410','5611','6110'].map(x=>[x,x+' '+KONTON[x]]),r.konto)}
      ${r.underlag?`<span class="badge badge-lock">${ic('paperclip')}${esc(r.underlag)}</span>`:ro?'':`<button class="btn btn-ghost" onclick="setRad('${k.id}','${a.id}',${i},'underlag','kvitto_${Date.now()%1000}.pdf')">${ic('paperclip')}Underlag</button>`}`;
    case 'mil':return `${falt(k,a,i,'km',r.km,60,'num')} km i egen bil`;
    case 'arvode':return `${falt(k,a,i,'belopp',r.belopp,90,'num')} kr`;
    case 'korr':return `${falt(k,a,i,'text',r.text,180)} ${falt(k,a,i,'belopp',r.belopp,80,'num')} kr <span class="mf">engångsskatt</span>`;
    case 'netto':return `${falt(k,a,i,'text',r.text,160)} ${falt(k,a,i,'belopp',r.belopp,80,'num')} kr`;
  }return ''}
function radEditor(k,a,opt){const c=calc(k,a),ro=k.status!=='utkast',rows=k.rader[a.id]||[];
  const typer=Object.entries(RADTYP).filter(([t])=>!(t==='manad'&&a.typ!=='manad')&&!(t==='tim'&&a.typ!=='timme'));
  return `<table class="redit" style="width:100%"><tbody>${rows.map((r,i)=>`<tr class="${c.fel.some(e=>e.i===i)?'err':''}"><td class="typ">${RADTYP[r.t]}</td><td>${radFalt(k,a,r,i)}${ferrRad(c,i)}</td><td class="num" style="width:100px">${kr(sum(c.L.filter(x=>x.i===i),x=>x.belopp))}</td><td style="width:30px">${ro||r.t==='manad'?'':`<button class="btn btn-ghost btn-icon" title="Ta bort raden" onclick="taBortRad('${k.id}','${a.id}',${i})">${ic('x')}</button>`}</td></tr>`).join('')}</tbody></table>

  ${c.fel.filter(e=>e.i===undefined).map(e=>`<div class="ferr">${ic('circle-alert')}<span>${esc(e.t)}${e.anst?` · <span class="link" onclick="go('#/lon/a-${a.id}')">öppna ${esc(a.namn)} i registret</span>`:''}</span></div>`).join('')}

function calcTab(a,c){return `<table class="calc" style="margin-top:8px;width:100%"><tbody>

  <div class="pay"><span>Skattetabell</span><span>Semester kvar</span><span>Sparade dagar</span><span>Konto</span><span>${a.sido?'30 %':a.tabell?a.tabell+' kol '+a.kol:'—'}</span><span>${a.sem.saldo} dagar</span><span>${a.sem.sparade}</span><span>${a.bank?esc(a.bank):'<span class="miss">saknas</span>'}</span></div>

function huvud(k){const s=sammanst(k);

    ${ag&&ag.lamnad?`<div class="note warn">${ic('triangle-alert')}<span>AGI för ${manad(k.period)} är redan lämnad. Perioden markeras som ändrad och du lämnar en ny fil.</span></div>`:''}
    <div class="flex" style="justify-content:flex-end"><button class="btn btn-outline" onclick="S.panel=null;render()">Avbryt</button><button class="btn btn-default" onclick="bokfor('${k.id}')">${ic('stamp')}Bokför V${vnrNasta()}</button></div>`;

  if(p.typ==='ratta'){const gam=[...k.ver].reverse().find(v=>v.typ==='Lönekörning');b=`<div class="flex" style="justify-content:space-between"><h2>Rätta lönekörningen</h2>${x}</div>

    <label><input type="radio" name="hur" ${p.hur==='senare'?'checked':''} onchange="S.panel.hur='senare';render()"><span><b style="font-weight:500">Korrigera i en senare lönekörning</b><br><span class="mf">en korrigeringsrad med engångsskatt läggs i nästa ordinarie utkast; den här lönekörningen ändras inte</span></span></label></div>
    ${p.hur==='om'?`<div><label class="label">Orsak (valfri, loggas)</label><input class="input" value="${esc(p.orsak)}" onchange="S.panel.orsak=this.value"></div>`:`<div class="g3"><div><label class="label">Anställd</label><select class="select" onchange="S.panel.aid=this.value">${deltagare(k).map(a=>`<option value="${a.id}" ${a.id===p.aid?'selected':''}>${esc(a.namn)}</option>`).join('')}</select></div><div><label class="label">Belopp (+ tillägg, − avdrag)</label><input class="input num" value="${esc(p.belopp)}" onchange="S.panel.belopp=this.value"></div><div><label class="label">Text på lönespecen</label><input class="input" placeholder="Retroaktivt tillägg ${MAN[+k.period.slice(5)-1]}" value="${esc(p.text)}" onchange="S.panel.text=this.value"></div></div>`}
    ${ag&&ag.lamnad?`<div class="note warn">${ic('triangle-alert')}<span>${p.hur==='om'?`AGI för ${manad(k.period)} är lämnad ${ag.lamnad}. När lönekörningen bokförts igen lämnar du en ny fil; IU med samma specifikationsnummer ersätter de gamla.`:'Korrigeringen redovisas i den senare periodens AGI.'}</span></div>`:''}
    <div class="flex" style="justify-content:flex-end"><button class="btn btn-outline" onclick="S.panel=null;render()">Avbryt</button><button class="btn btn-default" ${p.hur==='senare'&&!n(p.belopp)?'disabled':''} onclick="ratta('${k.id}')">${ic(p.hur==='om'?'undo-2':'arrow-right')}${p.hur==='om'?`Vänd V${gam.nr}`:'Lägg korrigeringen'}</button></div>`}
  return `<div class="inl">${b}</div>`}

/* ================= AGI-vy (gemensam) ================= */
function agiKropp(p,kompakt){const i=agiInfo(p),ag=i.ag,c=co();let b='';
  if(!i.behovs)return `<div class="note">${ic('info')}<span>Ingen AGI för ${manad(p)}: ${!c.arb.reg||p<c.arb.fran.slice(0,7)?'företaget var inte registrerat som arbetsgivare':'säsongsregistrerat och ingen utbetalning'}.</span></div>`;
  if(i.hinder.length)b+=`<div class="alert destructive">${ic('circle-alert')}<div><div class="t">Filen kan inte skapas</div><ul>${i.hinder.map(k=>`<li><span class="link" onclick="go('${S.variant==='C'?'#/lon/m-'+k.period:'#/lon/'+k.id}')">${esc(kTitel(k))}</span> är fastställd men inte bokförd${kanBokforas(k)?'':' (kan bokföras från '+dkort(k.utbet)+')'}</li>`).join('')}</ul></div></div>`;
  if(i.utk.length)b+=`<div class="note warn">${ic('triangle-alert')}<span>${i.utk.map(k=>esc(kTitel(k))).join(', ')} är utkast och kommer inte med förrän ${i.utk.length>1?'de':'den'} bokförts.</span></div>`;
  if(i.status==='andrad')b+=`<div class="note warn">${ic('triangle-alert')}<span>Lämnad ${ag.lamnad}, men en lönekörning i perioden ändrades ${ag.andrad}. Skapa en ny fil och lämna den; varje IU har specifikationsnummer 1 och ersätter den gamla.</span></div>`;
  if(i.noll)b+=`<div class="note">${ic('info')}<span>Ingen lön betalades ut i ${manad(p)}. Företaget är registrerat som arbetsgivare sedan ${c.arb.fran}, så en nolldeklaration ska lämnas: en HU med 0 i FK487 och FK497.</span></div>`;
  b+=`<div class="g4">${stat('Arbetsgivaravgifter · FK487',Math.floor(i.fk487))}${stat('Avdragen skatt · FK497',i.fk497)}${stat('Att betala till skattekontot',Math.floor(i.fk487)+i.fk497)}${stat('Individuppgifter',i.iu.length,1)}</div>`;
  if(!kompakt||i.iu.length)b+=`<table class="table"><thead><tr><th>Individuppgift</th><th>FK570</th>${['011','012','013','023','050','001'].map(f=>`<th class="num" title="${FKTXT[f]}">FK${f}</th>`).join('')}<th>Frånvaro</th></tr></thead><tbody>
    ${i.iu.map(u=>`<tr><td>${esc(u.a.namn)} <span class="mf">${u.a.pnr}</span></td><td>1</td>${['011','012','013','023','050','001'].map(f=>`<td class="num">${u.fk[f]?kr0(u.fk[f]):''}</td>`).join('')}<td class="mf">${u.frv.map(f=>f.typ+' '+dkort(f.datum)).join(', ')}</td></tr>`).join('')}
    ${i.bort.map(a=>`<tr><td>${esc(a.namn)}</td><td colspan="8"><span class="badge badge-forfallen">borttag FK205</span> fanns i den lämnade filen men inte längre</td></tr>`).join('')}
    ${!i.iu.length&&!i.bort.length?`<tr><td colspan="9" class="mf">Inga individuppgifter.</td></tr>`:''}</tbody></table>
    <div class="mf" style="font-size:11px">Avgifter per ålderskategori: ${Object.entries(i.avgK).map(([kk,bb])=>`${SATS_T[kk]} på ${kr0(bb)} kr = ${kr(r2(bb*SATS[kk]/100))}`).join(' · ')||'—'}. Arbetsplats ${esc(c.plats)}, ${esc(c.ort)} (FK245/246).</div>`;
  const kan=!i.hinder.length,lp=S.panel&&S.panel.typ==='lamna'&&S.panel.p===p;
  b+=`<div class="flex"><button class="btn ${i.status==='lamnad'?'btn-outline':'btn-default'}" ${kan?'':'disabled'} onclick="skapaXml('${p}')">${ic('file-code-2')}${ag.fil?'Skapa filen igen':'Skapa XML-fil'}</button>
    ${ag.fil&&i.status!=='lamnad'?`<button class="btn btn-default" onclick="S.panel={typ:'lamna',p:'${p}',datum:'${IDAG_S}'};render()">${ic('check')}Markera som lämnad…</button>`:''}
    ${ag.fil?`<span class="mf">skapad ${ag.fil} · <span class="link" onclick="S.xml=S.xml==='${p}'?false:'${p}';render()">${S.xml===p?'dölj':'visa'} XML</span> · ladda upp och signera i Skatteverkets e-tjänst</span>`:`<span class="mf">${kan?'filen valideras mot XSD 1.1 innan du laddar ner den':''}</span>`}</div>`;
  if(lp)b+=`<div class="inl"><div class="flex" style="justify-content:space-between"><h2>Markera AGI ${manad(p)} som lämnad</h2><button class="btn btn-ghost btn-icon" onclick="S.panel=null;render()">${ic('x')}</button></div><div class="g3"><div><label class="label">Lämnad datum</label><input class="input" value="${S.panel.datum}" onchange="S.panel.datum=this.value"></div></div>
    <div class="note">${ic('info')}<span>Maya kan inte se om filen signerats i e-tjänsten; markeringen är din uppgift. Ändras en lönekörning i perioden efteråt flaggas den.</span></div><div class="flex" style="justify-content:flex-end"><button class="btn btn-outline" onclick="S.panel=null;render()">Avbryt</button><button class="btn btn-default" onclick="lamna('${p}')">${ic('check')}Markera som lämnad</button></div></div>`;
  if(S.xml===p)b+=`<pre class="xml">${esc(xmlFor(i))}</pre>`;
  return b}
function skattKropp(p){const i=agiInfo(p),sk=SKATT[S.co][p],bel=Math.floor(i.fk487)+i.fk497,sp=S.panel&&S.panel.typ==='skatt'&&S.panel.p===p;

function agiSida(p){const i=agiInfo(p);return `<div class="flex" style="justify-content:space-between"><div class="col" style="gap:4px"><div class="flex"><h1>Arbetsgivardeklaration ${manad(p)}</h1>${agiBadge(i)}</div><div class="mf">${i.bokf.length} bokförda lönekörningar med utbetalning i perioden · frist ${i.frist}</div></div></div>
  ${agiKropp(p)}<div><div class="sec-t">Skatteinbetalning</div>${skattKropp(p)}</div>`}

  <div class="meta">${a.ledare?'<span class="badge badge-lock">företagsledare</span>':''}${a.slut?`<span class="badge badge-warn">slutar ${dkort(a.slut)}</span>`:''}${!a.tabell&&!a.sido&&!a.jamk?'<span class="badge badge-forfallen">skatt saknas</span>':''}<span>${a.pnr}</span></div></a>`).join('')}
  <button class="btn btn-outline" style="margin-top:6px" onclick="inteHar('Ny anställd')">${ic('user-plus')}Ny anställd</button></div>`}
function anstSida(a){const e=S.edit&&S.edit.id===a.id?S.edit:null;
  const f=(k,t)=>`<dt>${t}</dt><dd>${e&&k in e.v?`<input class="input" value="${esc(e.v[k]??'')}" onchange="S.edit.v['${k}']=this.value">`:esc(a[k]??'')||'<span class="mf">—</span>'}</dd>`;
  return `<div class="flex" style="justify-content:space-between"><div class="col" style="gap:4px"><div class="flex"><h1>${esc(a.namn)}</h1>${a.ledare?'<span class="badge badge-lock">företagsledare</span>':''}</div><div class="mf">${a.pnr} · anställd sedan ${a.anst}${a.slut?' · slutar '+a.slut:''}</div></div>
  ${e?'':`<button class="btn btn-outline" onclick="S.edit={id:'${a.id}',fran:'${IDAG_S}',v:{belopp:'${a.belopp}',tabell:'${a.tabell??''}',kol:'${a.kol}',giltig:'${a.giltig}',bank:'${esc(a.bank)}',epost:'${esc(a.epost)}',slut:'${a.slut}'}};render()">${ic('pencil')}Ändra…</button>`}</div>
  ${e?`<div class="inl"><div class="flex"><b style="font-weight:500">Ändringen gäller från</b><input class="input" style="width:130px" value="${e.fran}" onchange="S.edit.fran=this.value"><span class="mf">loggas med datum; lönekörningar med utbetalning från och med dagen använder de nya uppgifterna</span></div></div>`:''}
  <div class="paper"><div><div class="sec-t">Lön och anställning</div><dl class="kv2">${f('belopp',a.typ==='timme'?'Timlön (kr)':a.typ==='styrelse'?'Arvode per gång (kr)':'Månadslön (kr)')}<dt>Lönetyp</dt><dd>${{manad:'Månadslön',timme:'Timlön, 12 % semesterersättning',styrelse:'Styrelsearvode'}[a.typ]}</dd><dt>Sysselsättning</dt><dd>${a.sys} % · ${a.vecka} h/vecka</dd>${f('slut','Slutdatum')}<dt>Arbetsgivaravgift</dt><dd>${SATS_T[avgKat(a)]}</dd></dl></div>
  <div><div class="sec-t">Skatt (från A-skattebeskedet)</div><dl class="kv2">${a.sido?'<dt>Avdrag</dt><dd>Sidoinkomst, 30 %</dd>':f('tabell','Skattetabell')+f('kol','Kolumn')}<dt>Jämkning</dt><dd>${a.jamk?a.jamk+' %':'<span class="mf">ingen</span>'}</dd>${f('giltig','Beslutet gäller t.o.m.')}</dl>
    ${!a.tabell&&!a.sido&&!a.jamk?`<div class="note warn" style="margin-top:6px">${ic('triangle-alert')}<span>Skatteuppgifter saknas. Kolumn ${fodd(a)>=1960?'1':'3'} föreslås utifrån åldern; tabellen står på A-skattebeskedet.</span></div>`:''}</div>
  <div><div class="sec-t">Semester</div><dl class="kv2"><dt>Dagar per år</dt><dd>${a.sem.dagar}</dd><dt>Saldo betalda dagar</dt><dd>${a.sem.saldo}</dd><dt>Sparade dagar</dt><dd>${a.sem.sparade}${a.sem.sparade>=4?' <span class="mf">· äldsta sparade dagar måste tas ut inom fem år</span>':''}</dd></dl></div>

  ${e?`<div class="flex" style="justify-content:flex-end"><button class="btn btn-outline" onclick="S.edit=null;render()">Avbryt</button><button class="btn btn-default" onclick="sparaAnst('${a.id}')">Spara</button></div>`:''}
  <div><div class="sec-t">Ändringar</div><ul class="hist">${a.hist.map(x=>`<li>${ic('history')}<span class="t">${x.tid}</span><span>${esc(x.t)} <span class="mf">· ${esc(x.v)}</span></span></li>`).join('')||'<li class="mf">Inga ändringar.</li>'}</ul></div>

  ${kor().some(k=>k.rader[a.id])?`<div class="note" style="margin-top:6px">${ic('info')}<span>Har lönekörningar och kan därför bara avslutas och arkiveras, inte raderas.</span></div>`:''}</div></div>`}

/* ================= Att göra ================= */
function attGora(){const l=kor(),ut=[];
  const agiP=PERIODER.map(agiInfo).filter(i=>i.behovs&&i.status==='ej'&&dagMellan(IDAG_S,i.frist)<=7);
  const skP=PERIODER.map(agiInfo).filter(i=>i.ag.lamnad&&!SKATT[S.co][i.p]&&(Math.floor(i.fk487)+i.fk497)>0&&dagMellan(IDAG_S,i.frist)<=7);
  return [
    ['Arbetsgivardeklaration att lämna','file-code-2',agiP.map(i=>({id:'agi-'+i.p,t:'AGI '+manad(i.p)+(i.noll?' (nolldeklaration)':''),m:IDAG_S>i.frist?`försenad, skulle lämnats ${i.frist}`:'senast '+i.frist,bad:IDAG_S>i.frist}))],
    ['Skatt att betala','landmark',skP.map(i=>({id:'agi-'+i.p,t:'Skatt och avgifter '+manad(i.p),m:'senast '+i.frist,amt:Math.floor(i.fk487)+i.fk497}))],
    ['Lämnad AGI som ändrats','triangle-alert',PERIODER.map(agiInfo).filter(i=>i.status==='andrad').map(i=>({id:'agi-'+i.p,t:'AGI '+manad(i.p),m:`lämnad ${i.ag.lamnad}, ändrad ${i.ag.andrad}`,bad:true}))],
    ['Fastställda, utbetalningsdagen har passerat','stamp',l.filter(k=>k.status==='faststalld'&&kanBokforas(k)).map(k=>({id:k.id,t:kTitel(k),m:'utbetald '+k.utbet+', inte bokförd',amt:sammanst(k).netto}))],
    ['Utkast','pencil-line',l.filter(k=>k.status==='utkast').map(k=>({id:k.id,t:kTitel(k),m:(k.kanal!=='webb'?'AI · ':'')+'utbetalning '+k.utbet+(sammanst(k).fel.length?` · ${sammanst(k).fel.length} att åtgärda`:''),amt:sammanst(k).netto,ai:k.kanal!=='webb'}))],
  ]}
const antalAttGora=()=>attGora().reduce((a,[, ,l])=>a+l.length,0);
function inkorgLista(rt){return `<div class="lh"><h2>Att göra</h2><span class="mf">lön</span></div>`+attGora().map(([t,i,l])=>l.length?`<div class="sect">${ic(i)}${t} · ${l.length}</div>`+l.map(x=>`<a class="item ${rt.id===x.id?'on':''}" href="#/inkorg/${x.id}" style="padding:8px 10px"><div class="top"><span>${esc(x.t)}</span><span class="num">${x.amt!==undefined?kr(x.amt):''}</span></div><div class="meta">${x.ai?`<span class="badge badge-ai">${ic('sparkles')}AI</span>`:''}<span class="${x.bad?'diff-bad':''}">${esc(x.m)}</span></div></a>`).join(''):'').join('')
  +`<div class="sect">${ic('calendar-clock')}Kommande</div>`+kor().filter(k=>k.status!=='bokford'&&!kanBokforas(k)).map(k=>`<div class="item plain"><div class="top"><span>Utbetalning ${esc(kTitel(k).toLowerCase())}</span><span class="mf">${dkort(k.utbet)}</span></div></div>`).join('')
  +`<div class="item plain"><div class="top"><span>AGI och skatt oktober</span><span class="mf">${dkort(frist('2026-10'))}</span></div></div>`}

/* ================= Listor ================= */
function flikar(t){return `<div class="tabs" style="margin-bottom:6px">${t.map(([k,x])=>`<button class="${S.flik===k?'on':''}" onclick="S.flik='${k}';render()">${x}</button>`).join('')}</div>`}
function korItem(k,rt){const s=sammanst(k);return `<a class="item ${rt.id===k.id?'on':''}" href="#/lon/${k.id}" style="padding:8px 10px"><div class="top"><span>${esc(kTitel(k))}</span><span class="num">${kr(s.netto)}</span></div><div class="meta">${sBadge(k)}${aiTag(k)}<span>utbetalning ${dkort(k.utbet)} · ${deltagare(k).length} anst.</span>${s.fel.length&&k.status==='utkast'?`<span class="diff-bad">${s.fel.length} att åtgärda</span>`:''}</div></a>`}
function agiItem(p,rt){const i=agiInfo(p);return `<a class="item plain ${rt.id==='agi-'+p?'on':''}" href="#/lon/agi-${p}" style="padding:8px 10px"><div class="top"><span>${ic('file-code-2')} AGI ${manad(p)}</span><span class="num">${kr(Math.floor(i.fk487)+i.fk497)}</span></div><div class="meta">${agiBadge(i)}${SKATT[S.co][p]?'<span class="mchip ok">'+ic('check')+'skatt betald</span>':''}</div></a>`}
const nyKnapp=()=>`<button class="btn btn-default" onclick="S.panel={typ:'ny',typK:'ordinarie',typ2:'ordinarie',utbet:'2026-11-25',namn:'',valda:aktiva('2026-11').map(a=>a.id)};S.panel.typ='ny';go('#/lon/ny')">${ic('plus')}Ny lönekörning</button>`;
function listaA(rt){if(S.flik==='anstallda')return flikar([['korningar','Per månad'],['anstallda','Anställda']])+anstLista(rt);
  return `<div class="lh">${flikar([['korningar','Per månad'],['anstallda','Anställda']])}${nyKnapp()}</div>`+PERIODER.map(p=>{const ks=kor().filter(k=>k.utbet.slice(0,7)===p);return `<div class="sect">${ic('calendar')}${Manad(p)}</div>${ks.map(k=>korItem(k,rt)).join('')}${agiItem(p,rt)}`}).join('')}
function listaB(rt){const t=[['korningar','Lönekörningar'],['agi','Deklarationer'],['anstallda','Anställda']];
  if(S.flik==='anstallda')return flikar(t)+anstLista(rt);
  if(S.flik==='agi')return flikar(t)+PERIODER.map(p=>agiItem(p,rt)).join('');
  const g=[['Att hantera',kor().filter(k=>k.status!=='bokford')],['Bokförda',kor().filter(k=>k.status==='bokford')]];
  return `<div class="lh">${flikar(t)}${nyKnapp()}</div>`+g.map(([x,l])=>l.length?`<div class="sect">${x} · ${l.length}</div>`+l.map(k=>korItem(k,rt)).join(''):'').join('')}
function listaC(rt){const t=[['korningar','Månader'],['anstallda','Anställda']];if(S.flik==='anstallda')return flikar(t)+anstLista(rt);
  return `<div class="lh">${flikar(t)}${nyKnapp()}</div>`+PERIODER.map(p=>{const i=agiInfo(p),ks=kor().filter(k=>k.utbet.slice(0,7)===p),sk=SKATT[S.co][p];
    const st=ks.map(k=>k.status),chip=(ok,t,cls)=>`<span class="mchip ${cls||(ok?'ok':'')}">${ic(ok?'circle-check':'circle-dashed')}${t}</span>`;
    return `<a class="item ${rt.id==='m-'+p?'on':''}" href="#/lon/m-${p}"><div class="top"><span>${Manad(p)}</span><span class="num">${kr(sum(ks,k=>sammanst(k).netto))}</span></div>
      <div class="meta">${ks.length?chip(!st.includes('utkast')&&!st.includes('faststalld'),`${ks.length} lönekörning${ks.length>1?'ar':''}`,st.includes('utkast')||st.includes('faststalld')?'warn':''):chip(false,'ingen lön')}
      ${i.behovs?chip(i.status==='lamnad','AGI',i.status==='andrad'||(i.status==='ej'&&IDAG_S>i.frist)?'bad':''):''}${i.behovs&&(Math.floor(i.fk487)+i.fk497)?chip(!!sk,'skatt'):''}</div></a>`}).join('')}

/* ================= Variant A: tabell över alla anställda ================= */
function runA(k){const s=sammanst(k),ro=k.status!=='utkast';
  return `${huvud(k)}${felLista(s)}${s.varn.filter(v=>!v.namn).map(v=>`<div class="note warn">${ic('triangle-alert')}<span>${esc(v.t)}</span></div>`).join('')}
  <table class="table lt"><thead><tr><th>Anställd</th><th class="num">Lön</th><th class="num">Frånvaro</th><th class="num">Förmåner</th><th class="num">Skattefritt</th><th class="num">Bruttolön</th><th class="num">Skatt</th><th class="num">Nettolön</th><th class="num">Avgifter</th><th></th></tr></thead><tbody>
  ${s.C.map(({a,c})=>{const op=S.open[a.id],fr=sum(c.L.filter(x=>x.belopp<0&&x.kat==='kontant'),x=>x.belopp)+sum(c.L.filter(x=>/^Sjuklön/.test(x.text)),x=>x.belopp);
    return `<tr class="row ${op?'open':''} ${c.fel.length?'bad':''}" onclick="S.open['${a.id}']=!S.open['${a.id}'];render()"><td>${ic(op?'chevron-down':'chevron-right')} ${esc(a.namn)} ${c.fel.length?`<span class="dot" title="${c.fel.length} att åtgärda"></span>`:''}${c.varn.length&&!c.fel.length?ic('triangle-alert','class="warn"'):''}</td>
    <td class="num">${kr(sum(c.L.filter(x=>x.kat==='kontant'&&x.belopp>0&&!/^Sjuklön/.test(x.text)),x=>x.belopp))}</td><td class="num">${fr?kr(fr):''}</td><td class="num">${c.forman?kr(c.forman):''}</td><td class="num">${c.skfri?kr(c.skfri):''}</td>
    <td class="num">${kr(c.brutto)}</td><td class="num">${kr(c.skatt)}</td><td class="num"><b style="font-weight:500">${kr(c.netto)}</b></td><td class="num mf">${kr(c.avg)}</td><td><span class="link" onclick="event.stopPropagation();S.modal={typ:'spec',kid:'${k.id}',aid:'${a.id}'};render()">spec</span></td></tr>
    ${op?`<tr class="exp"><td colspan="10">${radEditor(k,a,{taBort:!ro})}</td></tr>`:''}`}).join('')}
  <tr class="sumrow"><td>Summa</td><td></td><td></td><td class="num">${kr(s.forman)}</td><td class="num">${kr(s.skfri)}</td><td class="num">${kr(s.brutto)}</td><td class="num">${kr(s.skatt)}</td><td class="num">${kr(s.netto)}</td><td class="num">${kr(s.avg)}</td><td></td></tr></tbody></table>
  ${saknas(k)}${bokforsSom(k)}${verLista(k)}${specLista(k)}${historik(k)}`}

/* ================= Variant B: en anställd i taget, lönespecen bredvid ================= */
function runB(k){const s=sammanst(k),ro=k.status!=='utkast';const C=s.C;if(!C.find(x=>x.a.id===S.emp))S.emp=C[0]?.a.id||null;const cur=C.find(x=>x.a.id===S.emp);
  return `${huvud(k)}${totRad(s)}
  <div class="B-run"><div class="emps">${C.map(({a,c})=>`<div class="emp ${a.id===S.emp?'on':''}" onclick="S.emp='${a.id}';render()"><div class="r"><b style="font-weight:500">${esc(a.namn)}</b>${c.fel.length?`<span class="dot"></span>`:''}</div><div class="r mf"><span>${a.typ==='timme'?'timlön':a.typ==='styrelse'?'arvode':'månadslön'}</span><span class="num">${kr(c.netto)}</span></div></div>`).join('')}
    ${ro?'':aktiva(k.period).filter(a=>!k.rader[a.id]).map(a=>`<div class="emp" style="border-style:dashed" onclick="laggTill('${k.id}','${a.id}')"><div class="r mf"><span>${ic('user-plus')} ${esc(a.namn)}</span></div></div>`).join('')}
    ${s.fel.length?`<div class="note" style="color:var(--destructive);margin-top:6px">${ic('circle-alert')}<span>${s.fel.length} att åtgärda</span></div>`:''}</div>
    <div class="col" style="gap:12px">${cur?`<div class="flex" style="justify-content:space-between"><h2>${esc(cur.a.name||cur.a.namn)}</h2><span class="mf">${cur.a.pnr} · <span class="link" onclick="go('#/lon/a-${cur.a.id}')">registret</span></span></div>${radEditor(k,cur.a,{taBort:!ro,calc:true})}`:'<div class="mf">Ingen anställd vald.</div>'}
      ${bokforsSom(k)}${verLista(k)}${specLista(k)}${historik(k)}</div>
    <div class="right">${cur?specPapper(k,cur.a):''}<div class="mf" style="font-size:11px;margin-top:6px">${ro?'Arkiverad PDF · genereras aldrig om':'Förhandsvisning; PDF:en skapas när lönekörningen fastställs'}</div></div></div>`}

/* ================= Variant C: månaden som kedja ================= */
function monthC(p){const ks=kor().filter(k=>k.utbet.slice(0,7)===p),i=agiInfo(p),sk=SKATT[S.co][p];
  const allaB=ks.length&&ks.every(k=>k.status==='bokford'),bel=Math.floor(i.fk487)+i.fk497;
  const st=(cls,t,d,anchor)=>`<div class="st ${cls}" onclick="document.getElementById('${anchor}')?.scrollIntoView({behavior:'smooth'})"><span class="t">${t}</span><span class="d">${d}</span></div>`;
  return `<div class="col" style="gap:4px"><h1>Lön ${manad(p)}</h1><div class="mf">AGI och skatt senast ${i.frist}</div></div>
  <div class="chain">${st(ks.some(k=>k.status==='utkast')?'cur':ks.length?'ok':'',`${ic('users')}Lönekörningar`,ks.length?ks.map(k=>STATUS[k.status][0].toLowerCase()).join(', '):'ingen lön','c-kor')}<span class="ar"></span>
    ${st(allaB?'ok':ks.some(k=>k.status==='faststalld')?'cur':'',`${ic('stamp')}Bokförda`,ks.length?`${ks.filter(k=>k.status==='bokford').length} av ${ks.length}`:'—','c-kor')}<span class="ar"></span>
    ${st(!i.behovs?'':i.status==='lamnad'?'ok':i.status==='andrad'||IDAG_S>i.frist?'bad':'cur',`${ic('file-code-2')}AGI`,!i.behovs?'behövs inte':i.status==='lamnad'?'lämnad '+dkort(i.ag.lamnad):i.status==='andrad'?'ändrad, lämna igen':(i.noll?'nolldeklaration · ':'')+'senast '+dkort(i.frist),'c-agi')}<span class="ar"></span>
    ${st(!bel?'':sk?'ok':'',`${ic('landmark')}Skatt`,!bel?(ks.length&&!allaB?'när lönen bokförts':'inget att betala'):sk?'bokförd V'+sk.nr:kr0(bel)+' kr senast '+dkort(i.frist),'c-skatt')}</div>
  ${ks.some(k=>k.status==='faststalld')?`<div class="note warn">${ic('lock')}<span>${manad(p)} kan inte låsas så länge ${ks.filter(k=>k.status==='faststalld').map(k=>esc(kTitel(k))).join(', ')} är fastställd men inte bokförd.</span></div>`:''}
  <div id="c-kor" class="col" style="gap:12px">${ks.map(k=>korKortC(k)).join('')||`<div class="placeholder">${ic('users')}Ingen lönekörning i ${manad(p)}.<button class="btn btn-outline" onclick="S.panel={typ:'ny',typ2:'ordinarie',utbet:'${p}-25',namn:'',valda:aktiva('${p}').map(a=>a.id)};go('#/lon/ny')">${ic('plus')}Ny lönekörning</button></div>`}</div>
  <div id="c-agi" class="mcard"><div class="mh"><h2>Arbetsgivardeklaration</h2>${agiBadge(i)}</div>${agiKropp(p,true)}</div>
  <div id="c-skatt" class="mcard"><div class="mh"><h2>Skatteinbetalning</h2></div>${skattKropp(p)}</div>`}
function korKortC(k){const s=sammanst(k),ro=k.status!=='utkast',pe=S.panel&&S.panel.typ==='rader'&&S.panel.id===k.id?S.panel.aid:null;
  return `<div class="mcard">${huvud(k)}
  <table class="table lt"><thead><tr><th>Anställd</th><th class="num">Bruttolön</th><th class="num">Förmåner</th><th class="num">Skatt</th><th class="num">Nettolön</th><th class="num">Avgifter</th><th></th></tr></thead><tbody>
  ${s.C.map(({a,c})=>`<tr class="${c.fel.length?'bad':''} ${pe===a.id?'open':''}"><td>${esc(a.namn)} ${c.fel.length?`<span class="diff-bad" style="font-size:11px">${ic('circle-alert')}${esc(c.fel[0].t)}${c.fel.length>1?' +'+(c.fel.length-1):''}</span>`:''}</td><td class="num">${kr(c.brutto)}</td><td class="num">${c.forman?kr(c.forman):''}</td><td class="num">${kr(c.skatt)}</td><td class="num">${kr(c.netto)}</td><td class="num mf">${kr(c.avg)}</td>
    <td style="white-space:nowrap"><button class="btn btn-ghost" onclick="S.panel=${pe===a.id?'null':`{typ:'rader',id:'${k.id}',aid:'${a.id}'}`};render()">${ic(ro?'eye':'pencil')}${ro?'Visa':'Ändra'}</button><button class="btn btn-ghost btn-icon" title="Lönespec" onclick="S.modal={typ:'spec',kid:'${k.id}',aid:'${a.id}'};render()">${ic('file-text')}</button></td></tr>
    ${pe===a.id?`<tr class="exp"><td colspan="7"><div class="inl" style="margin-top:6px"><div class="flex" style="justify-content:space-between"><h2>${esc(a.namn)}</h2><button class="btn btn-ghost btn-icon" onclick="S.panel=null;render()">${ic('x')}</button></div>${radEditor(k,a,{taBort:!ro})}</div></td></tr>`:''}`).join('')}
  <tr class="sumrow"><td>Summa</td><td class="num">${kr(s.brutto)}</td><td class="num">${kr(s.forman)}</td><td class="num">${kr(s.skatt)}</td><td class="num">${kr(s.netto)}</td><td class="num">${kr(s.avg)}</td><td></td></tr></tbody></table>
  ${saknas(k)}<details><summary class="mf" style="cursor:pointer">Kontering, lönespecifikationer och historik</summary><div class="col" style="gap:12px;margin-top:10px">${bokforsSom(k)}${verLista(k)}${specLista(k)}${historik(k)}</div></details></div>`}

/* ================= Ny lönekörning (gemensam) ================= */
function nySida(){const p=S.panel&&S.panel.typ==='ny'?S.panel:(S.panel={typ:'ny',typ2:'ordinarie',utbet:'2026-11-25',namn:'',valda:aktiva('2026-11').map(a=>a.id)});
  const per=p.utbet.slice(0,7),dubbel=p.typ2==='ordinarie'&&kor().some(k=>k.typ==='ordinarie'&&k.period===per),fel=[];
  if(dubbel)fel.push(`Det finns redan en ordinarie lönekörning för ${manad(per)}. Gör en extra lönekörning i stället.`);
  if(last(p.utbet))fel.push(`Utbetalningsdagen ligger i en låst period.`);if(!p.valda.length)fel.push('Välj minst en anställd.');
  const ag=AGI[S.co][per];
  return `<h1>Ny lönekörning</h1><div class="paper" style="max-width:640px">
  <div class="seg"><button class="${p.typ2==='ordinarie'?'on':''}" onclick="S.panel.typ2='ordinarie';render()">Ordinarie</button><button class="${p.typ2==='extra'?'on':''}" onclick="S.panel.typ2='extra';render()">Extra</button></div>
  <div class="g2"><div><label class="label">Utbetalningsdag</label><input class="input ${dubbel||last(p.utbet)?'err':''}" value="${p.utbet}" onchange="S.panel.utbet=this.value;render()"><div class="mf" style="font-size:11px;margin-top:3px">AGI-period ${manad(per)} · skattetabeller ${per.slice(0,4)}${per.slice(5)==='01'?' (eller föregående års)':''}</div></div>
  ${p.typ2==='extra'?`<div><label class="label">Namn</label><input class="input" placeholder="t.ex. Slutlön, Retroaktiv lön" value="${esc(p.namn)}" onchange="S.panel.namn=this.value"></div>`:''}</div>
  <div><label class="label">Anställda</label><div class="pick">${anst().map(a=>{const akt=aktiva(per).includes(a);return `<label style="${akt?'':'opacity:.5'}"><input type="checkbox" ${p.valda.includes(a.id)?'checked':''} ${akt?'':'disabled'} onchange="S.panel.valda=this.checked?[...S.panel.valda,'${a.id}']:S.panel.valda.filter(x=>x!=='${a.id}');render()">${esc(a.namn)}<span class="mf" style="margin-left:auto">${akt?{manad:'månadslön',timme:'timlön',styrelse:'styrelsearvode'}[a.typ]:'slutat '+a.slut}</span></label>`}).join('')}</div></div>
  ${fel.map(t=>`<div class="ferr">${ic('circle-alert')}<span>${t}</span></div>`).join('')}
  ${ag&&ag.lamnad?`<div class="note warn">${ic('triangle-alert')}<span>AGI för ${manad(per)} är redan lämnad.</span></div>`:''}
  <div class="flex" style="justify-content:flex-end"><button class="btn btn-outline" onclick="history.back()">Avbryt</button><button class="btn btn-default" ${fel.length?'disabled':''} onclick="skapaKorning()">${ic('plus')}Skapa utkast</button></div></div>`}

/* ================= Varianter ================= */
const A={namn:'Tabell över alla anställda',lista:listaA,run:runA};
const B={namn:'En anställd i taget, lönespecen bredvid',lista:listaB,run:runB};
const C={namn:'Månaden som kedja',lista:listaC,run:k=>monthC(k.period)};
const VARIANTS={A,B,C};

/* ================= Skal (variant D från gränssnittsprototypen) ================= */
function coMenu(){return `<div class="dropdown"><div class="lbl">Företag</div>${FORETAG.map(f=>`<button class="mi" onclick="byt('${f.id}')"><span class="logo sm">${initialer(f.namn)}</span><span style="flex:1"><b style="font-weight:500">${esc(f.namn)}</b><br><span class="mf">${f.orgnr}</span></span>${f.id===S.co?ic('check'):''}</button>`).join('')}</div>`}
function byt(id){S.co=id;S.coMenu=false;S.flash='';S.panel=null;S.emp=null;S.open={};go('#/inkorg')}
const flashBox=()=>S.flash?`<div class="alert ok">${ic('circle-check')}<div class="t">${esc(S.flash)}</div><button class="btn btn-ghost btn-icon" onclick="S.flash='';render()">${ic('x')}</button></div>`:'';
function detalj(rt,V){const id=rt.id;if(!id)return null;
  if(id==='ny')return nySida();
  if(id.startsWith('a-')){const a=hittaA(id.slice(2));return a?anstSida(a):null}
  if(id.startsWith('agi-')){const p=id.slice(4);return S.variant==='C'&&rt.mod==='lon'?monthC(p):agiSida(p)}
  if(id.startsWith('m-'))return monthC(id.slice(2));
  const k=hittaK(id);return k?V.run(k):null}
function skal(rt,V){const mod=rt.mod;let page;
  if(mod!=='inkorg'&&mod!=='lon')page=`<div style="padding:24px"><div class="placeholder">${ic('construction')}Sidan prototypas i ett eget ticket.</div></div>`;
  else{const inner=detalj(rt,V);
    const det=inner?`<div class="detail">${flashBox()}${inner}</div>`:`<div class="detail">${flashBox()}<div class="empty"><div>${ic('mouse-pointer-click','style="width:20px;height:20px"')}<p>Välj något i listan</p></div></div></div>`;
    page=`<div class="split"><div class="list">${mod==='inkorg'?inkorgLista(rt):V.lista(rt)}</div>${det}</div>`}
  const antal=antalAttGora();
  return `<div class="B"><header>
    <span class="brand"><span class="logo" style="width:24px;height:24px">M</span></span><span class="mf">/</span>
    <div class="co"><button class="btn btn-ghost" onclick="S.coMenu=!S.coMenu;render()">${esc(co().namn)}${ic('chevrons-up-down')}</button>${S.coMenu?coMenu():''}</div>
    <nav>${NAV.map(([k,t])=>`<a href="#/${k}" class="${mod===k?'on':''}">${t}${k==='inkorg'&&antal?`<span class="badge badge-count">${antal}</span>`:''}</a>`).join('')}</nav>
    <div class="right"><span class="search" onclick="palett()">${ic('search')}Sök verifikat, anställd…<kbd>⌘K</kbd></span><button class="btn btn-ghost btn-icon" onclick="tema()" title="Ljust/mörkt">${ic('sun-moon')}</button></div>
  </header>${page}</div>${modal()}${S.pal?pal():''}`}
function modal(){const m=S.modal;if(!m)return '';
  if(m.typ==='spec'){const k=hittaK(m.kid),a=hittaA(m.aid),v=m.ver?k.specar.find(x=>x.ver===m.ver):null;
    return `<div class="pal-bg" onclick="if(event.target===this){S.modal=null;render()}"><div class="dialog" style="width:620px"><div class="flex" style="justify-content:space-between"><h2>Lönespecifikation · ${esc(a.namn)}</h2><button class="btn btn-ghost btn-icon" onclick="S.modal=null;render()">${ic('x')}</button></div>${specPapper(k,a,v)}</div></div>`}
  return ''}
/* Snabbsökning */
function opts(){const q=S.palQ.toLowerCase();
  const o=[{g:'Förslag',t:'Ny lönekörning',i:'plus',run:()=>go('#/lon/ny')},...kor().map(k=>({g:'Lönekörningar',t:kTitel(k),amt:kr(sammanst(k).netto),i:'users',run:()=>go(S.variant==='C'?'#/lon/m-'+k.period:'#/lon/'+k.id)})),
    ...PERIODER.map(p=>({g:'Arbetsgivardeklarationer',t:'AGI '+manad(p),i:'file-code-2',run:()=>go('#/lon/agi-'+p)})),...anst().map(a=>({g:'Anställda',t:a.namn,s:a.pnr,i:'user',run:()=>{S.flik='anstallda';go('#/lon/a-'+a.id)}}))];
  if(!q)return o.slice(0,10);const norm=t=>String(t).toLowerCase().replace(/\s/g,'');const qq=norm(q);return o.filter(x=>norm(x.t+' '+(x.amt||'')+' '+(x.s||'')).includes(qq)).slice(0,14)}
function pal(){const o=opts();let g='';
  return `<div class="pal-bg" onclick="if(event.target===this){S.pal=false;render()}"><div class="pal"><div class="in">${ic('search')}<input id="palq" placeholder="Sök lönekörning, anställd, period…" value="${esc(S.palQ)}" oninput="S.palQ=this.value;S.palI=0;render();const e=document.getElementById('palq');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div>
    <div class="ls">${o.map((x,i)=>{const hh=x.g!==g?(g=x.g,`<div class="grp">${x.g}</div>`):'';return hh+`<div class="opt ${i===S.palI?'on':''}" onclick="runOpt(${i})">${ic(x.i)}<span class="t">${esc(x.t)}</span>${x.amt?`<span class="amt">${x.amt}</span>`:''}</div>`}).join('')||'<div class="opt mf">Inga träffar.</div>'}</div></div></div>`}
function runOpt(i){const o=opts()[i];S.pal=false;S.palQ='';o&&o.run();render()}
function palett(){S.pal=true;S.palQ='';S.palI=0;render();setTimeout(()=>document.getElementById('palq')?.focus())}

/* ================= Render, tema, tangenter ================= */
let ritar=false;
function render(keepFocus){if(ritar)return;ritar=true;try{rita(keepFocus)}finally{ritar=false}}
function rita(keepFocus){
  const a=document.activeElement,all=[...document.querySelectorAll('input,textarea')],idx=keepFocus&&a?all.indexOf(a):-1,pos=idx>=0?a.selectionStart:null;
  const V=VARIANTS[S.variant]||A;const det=document.querySelector('.detail'),sc=det?det.scrollTop:0;
  document.getElementById('app').innerHTML=skal(route(),V);
  window.lucide&&lucide.createIcons();
  if(keepFocus){const d=document.querySelector('.detail');if(d)d.scrollTop=sc}
  if(idx>=0){const e=document.querySelectorAll('input,textarea')[idx];if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch{}}}
  const keys=Object.keys(VARIANTS);
  document.getElementById('proto-switcher').innerHTML=`<button onclick="cyk(-1)">←</button><span class="lbl">PROTOTYP · ${S.variant} (${V.namn}) · ${keys.indexOf(S.variant)+1}/${keys.length}</span><button onclick="cyk(1)">→</button>`;
}
function cyk(d){const k=Object.keys(VARIANTS);S.variant=k[(k.indexOf(S.variant)+d+k.length)%k.length];S.coMenu=false;S.pal=false;S.modal=null;if(S.panel&&S.panel.typ!=='ny')S.panel=null;
  const rt=route();if(S.variant==='C'&&rt.mod==='lon'&&rt.id&&hittaK(rt.id))location.hash='#/lon/m-'+hittaK(rt.id).period;
  else if(S.variant!=='C'&&rt.id&&rt.id.startsWith('m-')){const k=kor().find(x=>x.period===rt.id.slice(2));location.hash=k?'#/lon/'+k.id:'#/lon'}
  if(S.flik==='agi'&&S.variant!=='B')S.flik='korningar';
  const p=new URLSearchParams(location.search);p.set('variant',S.variant);history.replaceState(null,'','?'+p+location.hash);render()}
function tema(){const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'}
let senast=null;
window.addEventListener('hashchange',()=>{const rt=route();S.coMenu=false;S.modal=null;
  if(rt.id!==senast){if(!(S.panel&&S.panel.typ==='ny'&&rt.id==='ny'))S.panel=null;S.xml=false;S.edit=null}
  if(S.variant==='C'&&rt.mod==='lon'&&rt.id&&hittaK(rt.id)){location.hash='#/lon/m-'+hittaK(rt.id).period;return}
  render();senast=rt.id;S.flash=''});
document.addEventListener('click',e=>{if(S.coMenu&&!e.target.closest('.co')){S.coMenu=false;render()}});
document.addEventListener('keydown',e=>{
  const typing=e.target.matches('input,textarea,select,[contenteditable]');const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();S.pal?(S.pal=false,render()):palett();return}
  if(S.pal){const o=opts();
    if(e.key==='Escape'){S.pal=false;render()}
    else if(e.key==='ArrowDown'){e.preventDefault();S.palI=Math.min(S.palI+1,o.length-1);render();document.getElementById('palq').focus()}
    else if(e.key==='ArrowUp'){e.preventDefault();S.palI=Math.max(S.palI-1,0);render();document.getElementById('palq').focus()}
    else if(e.key==='Enter'){e.preventDefault();runOpt(S.palI)}
    return}
  if(e.key==='Escape'&&(S.modal||S.panel)){S.modal=null;S.panel=null;render();return}
  if(typing)return;
  if(e.key==='ArrowLeft')cyk(-1);
  if(e.key==='ArrowRight')cyk(1);
});
if(!location.hash)location.hash='#/lon/k4';
if(S.variant==='C'&&route().id&&hittaK(route().id))location.hash='#/lon/m-'+hittaK(route().id).period;
render();
</script>
</body>
</html>
