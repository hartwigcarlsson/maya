<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maya momsdeklaration</title>
<!--
  PROTOTYP, KASTA BORT. Svarar på: Hur ser momsdeklarationen ut i gränssnittet?
  (https://github.com/hartwigcarlsson/maya/issues/46). Flödet är beslutat i #18 (ADR 0008), filformatet för
  periodisk sammanställning i #58. Bygger på skalet i variant D av gränssnittsprototypen (#24) och mönstren från
  verifikat (#32), fakturorna (#43, #44) och lönekörningen (#45): lista och detalj, paneler i dokumentet,
  rutan "Bokförs som", spärrar vid fältet och en inaktiv huvudknapp som visar antal kvar.
  Tre varianter, ?variant=A|B|C (eller ← → / knapparna längst ned). Data, rutberäkning, kontroller, avräkning,
  filer och statusar är gemensamma; varianterna skiljer sig i vad momsperiodens sida utgår från:
  A: Blanketten. Deklarationen som Skatteverkets formulär; klick på en ruta visar kontona och verifikaten bakom den
  B: Kedjan. Momsperioden som kedja bokföring → kontroller → deklarerad → inlämnad → betald, som lönens variant C
  C: Avstämningen. Kontona per ruta och månad i en tabell, med rutorna, kontrollerna och knapparna i en spalt
  Allt ligger i minnet; ladda om sidan för att börja om. I dag är 2026-10-14.
  Exempel AB redovisar per kvartal: kv 2 är inlämnad och betald, kv 3 är inte deklarerad (ett AI-utkast ligger kvar,
  och V-verifikatet 14 aug har försäljning utan moms, så en rimlighetskontroll varnar), kv 4 pågår.
  Konsultbolaget i Lund AB redovisar per månad och säljer tjänster till EU: september är deklarerad men inte inlämnad
  och ett AI-utkast i september är spärrat; i oktober saknar en manuell EU-faktura sin moms, så en formell kontroll
  stoppar. Periodisk sammanställning kv 3 avviker från ruta 39.
  Kopplingstabellen är ett urval och beloppen är påhittade; formen är poängen. eSKD-filens taggordning följer
  tabellen i Skatteverkets beskrivning och ska testas mot e-tjänsten (#18 beslut 3).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* Tokens från presetet (Stone + Amber), ljust */
:root{
  --background:oklch(1 0 0);--foreground:oklch(0.147 0.004 49.25);
  --card:oklch(1 0 0);--popover:oklch(1 0 0);
  --primary:oklch(0.555 0.163 48.998);--primary-foreground:oklch(0.987 0.022 95.277);
  --secondary:oklch(0.967 0.001 286.375);--secondary-foreground:oklch(0.21 0.006 285.885);
  --muted:oklch(0.97 0.001 106.424);--muted-foreground:oklch(0.553 0.013 58.071);
  --accent:oklch(0.97 0.001 106.424);--accent-foreground:oklch(0.216 0.006 56.043);
  --destructive:oklch(0.577 0.245 27.325);
  --border:oklch(0.923 0.003 48.717);--input:oklch(0.923 0.003 48.717);--ring:oklch(0.709 0.01 56.259);
  --sidebar:oklch(0.985 0.001 106.423);--sidebar-primary:oklch(0.666 0.179 58.318);--sidebar-accent:oklch(0.97 0.001 106.424);--sidebar-border:oklch(0.923 0.003 48.717);
  --success:oklch(0.52 0.12 150);
  --radius:0.45rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --background:oklch(0.147 0.004 49.25);--foreground:oklch(0.985 0.001 106.423);
  --card:oklch(0.216 0.006 56.043);--popover:oklch(0.216 0.006 56.043);
  --primary:oklch(0.473 0.137 46.201);--primary-foreground:oklch(0.987 0.022 95.277);
  --secondary:oklch(0.274 0.006 286.033);--secondary-foreground:oklch(0.985 0 0);
  --muted:oklch(0.268 0.007 34.298);--muted-foreground:oklch(0.709 0.01 56.259);
  --accent:oklch(0.268 0.007 34.298);--accent-foreground:oklch(0.985 0.001 106.423);
  --destructive:oklch(0.704 0.191 22.216);
  --border:oklch(1 0 0 / 10%);--input:oklch(1 0 0 / 15%);--ring:oklch(0.553 0.013 58.071);
  --sidebar:oklch(0.216 0.006 56.043);--sidebar-primary:oklch(0.769 0.188 70.08);--sidebar-accent:oklch(0.268 0.007 34.298);--sidebar-border:oklch(1 0 0 / 10%);
  --success:oklch(0.75 0.13 150);
}}
:root[data-theme="dark"]{
  --background:oklch(0.147 0.004 49.25);--foreground:oklch(0.985 0.001 106.423);
  --card:oklch(0.216 0.006 56.043);--popover:oklch(0.216 0.006 56.043);
  --primary:oklch(0.473 0.137 46.201);--primary-foreground:oklch(0.987 0.022 95.277);
  --secondary:oklch(0.274 0.006 286.033);--secondary-foreground:oklch(0.985 0 0);
  --muted:oklch(0.268 0.007 34.298);--muted-foreground:oklch(0.709 0.01 56.259);
  --accent:oklch(0.268 0.007 34.298);--accent-foreground:oklch(0.985 0.001 106.423);
  --destructive:oklch(0.704 0.191 22.216);
  --border:oklch(1 0 0 / 10%);--input:oklch(1 0 0 / 15%);--ring:oklch(0.553 0.013 58.071);
  --sidebar:oklch(0.216 0.006 56.043);--sidebar-primary:oklch(0.769 0.188 70.08);--sidebar-accent:oklch(0.268 0.007 34.298);--sidebar-border:oklch(1 0 0 / 10%);
  --success:oklch(0.75 0.13 150);
}
*{box-sizing:border-box;border-color:var(--border)}
html,body{margin:0;height:100%}
body{background:var(--background);color:var(--foreground);font:13px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.lucide{width:14px;height:14px;flex-shrink:0;stroke-width:2}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mf{color:var(--muted-foreground)}
h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:14px;font-weight:500;margin:0}

/* Button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:28px;padding:0 8px;border-radius:calc(var(--radius) * .8);font-size:13px;font-weight:500;border:1px solid transparent;cursor:pointer;white-space:nowrap;background:transparent;transition:background .1s}
.btn-default{background:var(--primary);color:var(--primary-foreground)}
.btn-default:hover{background:color-mix(in oklch,var(--primary) 90%,transparent)}
.btn-outline{border-color:var(--input);background:var(--background)}
:root[data-theme="dark"] .btn-outline{background:color-mix(in oklch,var(--input) 30%,transparent)}
.btn-outline:hover,.btn-ghost:hover{background:var(--accent)}
.btn-secondary{background:var(--secondary);color:var(--secondary-foreground)}
.btn-icon{width:28px;padding:0}
.btn-destructive-ghost{color:var(--destructive)}
.btn-destructive-ghost:hover{background:color-mix(in oklch,var(--destructive) 10%,transparent)}

/* Badge */
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:500;white-space:nowrap;border:1px solid transparent;vertical-align:middle}
.badge svg.lucide{width:10px;height:10px}
.badge-utkast{border:1px dashed var(--muted-foreground);color:var(--muted-foreground)}
.badge-bokford{background:var(--secondary);color:var(--secondary-foreground)}
.badge-ai{border-color:var(--border);color:var(--foreground)}
.badge-rattad{background:color-mix(in oklch,var(--destructive) 12%,transparent);color:var(--destructive)}
.badge-count{background:var(--primary);color:var(--primary-foreground);height:18px;min-width:18px;padding:0 5px;justify-content:center}

/* Card */
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 0 0 1px color-mix(in oklch,var(--foreground) 10%,transparent);display:flex;flex-direction:column;gap:16px;padding:16px 0}
.card-header{padding:0 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-title{font-size:14px;font-weight:500}
.card-desc{color:var(--muted-foreground)}
.card-content{padding:0 16px}
.card-footer{padding:0 16px;display:flex;gap:8px;justify-content:flex-end;align-items:center}

/* Input */
.input{height:28px;border:1px solid var(--input);border-radius:calc(var(--radius) * .8);padding:0 8px;background:transparent;font-size:13px;width:100%}
:root[data-theme="dark"] .input{background:color-mix(in oklch,var(--input) 30%,transparent)}
.input:focus,.cell:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklch,var(--ring) 50%,transparent)}
.input[readonly]{background:var(--muted);color:var(--muted-foreground)}
.label{font-size:13px;font-weight:500;display:block;margin-bottom:6px}
.field-grid{display:grid;grid-template-columns:160px 1fr 1fr;gap:16px}

/* Table */
table{border-collapse:collapse;width:100%}
.table th{height:32px;padding:0 8px;text-align:left;font-weight:500;color:var(--muted-foreground);border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tbody tr:last-child td{border-bottom:0}
.table tr.click{cursor:pointer}
.table tr.click:hover td{background:color-mix(in oklch,var(--muted) 50%,transparent)}
.cell{width:100%;height:28px;border:1px solid transparent;border-radius:calc(var(--radius) * .8);padding:0 6px;background:transparent}
.cell:hover:not([readonly]){border-color:var(--input)}
.rows td{padding:2px 4px}
.sumrow td{font-weight:600;border-top:1px solid var(--border);padding:8px}
.diff-bad{color:var(--destructive);display:inline-flex;gap:4px;align-items:center}
.diff-ok{color:var(--success);display:inline-flex;gap:4px;align-items:center}

/* Alert */
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:start;border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;background:var(--card)}
.alert .t{font-weight:500}
.alert ul{margin:2px 0 0 16px;padding:0;color:var(--muted-foreground)}
.alert.destructive{color:var(--destructive)}
.alert.destructive ul{color:color-mix(in oklch,var(--destructive) 85%,var(--foreground))}
.alert.ok{color:var(--success)}

/* Tabs */
.tabs{display:inline-flex;background:var(--muted);border-radius:var(--radius);padding:3px;gap:2px}
.tabs button{height:22px;padding:0 10px;border:0;border-radius:calc(var(--radius) * .7);background:transparent;color:var(--muted-foreground);font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{background:var(--background);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.08)}
:root[data-theme="dark"] .tabs button.on{background:var(--input)}

/* Dropdown */
.dropdown{position:absolute;z-index:20;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;min-width:240px}
.dropdown .lbl{padding:6px 8px;color:var(--muted-foreground);font-size:11px}
.dropdown .mi{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;background:transparent;border-radius:calc(var(--radius) * .8);cursor:pointer;text-align:left}
.dropdown .mi:hover{background:var(--accent)}
.dropdown .sepl{height:1px;background:var(--border);margin:4px -4px}
.logo{width:28px;height:28px;border-radius:calc(var(--radius) * .8);background:var(--sidebar-primary);color:var(--primary-foreground);display:grid;place-items:center;font-weight:700;flex-shrink:0}
.logo.sm{width:22px;height:22px;font-size:11px;background:var(--muted);color:var(--foreground);border:1px solid var(--border)}
kbd{font:500 10px Inter,system-ui;border:1px solid var(--border);border-radius:4px;padding:1px 5px;background:var(--muted);color:var(--muted-foreground)}
.placeholder{display:grid;place-items:center;gap:8px;padding:64px;color:var(--muted-foreground);text-align:center;border:1px dashed var(--border);border-radius:var(--radius)}

/* ---------- Switcher (inte en del av designen) ---------- */
#proto-switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:999;display:flex;align-items:center;gap:6px;
  background:#111;color:#fff;border-radius:999px;padding:6px 8px;box-shadow:0 6px 24px rgba(0,0,0,.35);font:12px system-ui;border:2px dashed #f5c400}
#proto-switcher button{background:#333;color:#fff;border:0;border-radius:999px;padding:4px 10px;cursor:pointer}
#proto-switcher .lbl{padding:0 8px;white-space:nowrap}

/* ---------- Variant B: Inkorg först ---------- */
.B{display:flex;flex-direction:column;height:100vh}
.B header{display:flex;align-items:center;gap:12px;padding:0 12px;height:48px;border-bottom:1px solid var(--border);background:var(--background)}
.B .brand{display:flex;align-items:center;gap:8px;font-weight:600}
.B .co{position:relative}
.B .co .dropdown{top:34px;left:0}
.B nav{display:flex;gap:2px}
.B nav a{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:calc(var(--radius) * .8);color:var(--muted-foreground);font-weight:500}
.B nav a:hover{color:var(--foreground);background:var(--accent)}
.B nav a.on{color:var(--foreground);background:var(--accent)}
.B header .right{margin-left:auto;display:flex;gap:4px;align-items:center}
.B .split{flex:1;display:grid;grid-template-columns:360px 1fr;min-height:0}
.B .list{border-right:1px solid var(--border);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--sidebar)}
.B .list .lh{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 8px}
.B .sect{display:flex;align-items:center;gap:6px;color:var(--muted-foreground);font-size:11px;font-weight:500;padding:10px 4px 2px}
.B .item{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:calc(var(--radius) * .8);border:1px solid transparent;background:color-mix(in oklch,var(--muted) 50%,transparent)}
.B .item:hover{background:var(--muted)}
.B .item.on{border-color:var(--ring);background:var(--card)}
.B .item .top{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.B .item .meta{display:flex;gap:6px;align-items:center;color:var(--muted-foreground);flex-wrap:wrap}
.B .item.plain{background:transparent;border-color:var(--border)}
.B .detail{overflow:auto;padding:20px 28px 90px;display:flex;flex-direction:column;gap:16px}
.B .empty{display:grid;place-items:center;height:100%;color:var(--muted-foreground);text-align:center;gap:8px}

.search{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 8px;min-width:240px;border:1px solid var(--input);border-radius:calc(var(--radius) * .8);color:var(--muted-foreground);cursor:pointer;background:color-mix(in oklch,var(--muted) 50%,transparent)}
.search kbd{margin-left:auto}
.pal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:flex-start;padding-top:14vh;z-index:50}
.pal{width:520px;max-width:92vw;background:var(--popover);border-radius:var(--radius);box-shadow:0 0 0 1px color-mix(in oklch,var(--foreground) 10%,transparent),0 16px 48px rgba(0,0,0,.4);overflow:hidden}
.pal .in{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);color:var(--muted-foreground)}
.pal input{flex:1;height:40px;border:0;background:transparent;outline:none;font-size:13px;color:var(--foreground)}
.pal .ls{max-height:340px;overflow:auto;padding:4px}
.pal .opt{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:calc(var(--radius) * .8);cursor:pointer}
.pal .opt.on{background:var(--accent)}
.pal .opt kbd,.pal .opt .amt{margin-left:auto}
.pal .opt .amt{color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.pal .opt .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal .grp{padding:8px 8px 4px;font-size:11px;color:var(--muted-foreground);font-weight:500}
.pal .ft{display:flex;gap:12px;padding:6px 12px;border-top:1px solid var(--border);color:var(--muted-foreground);font-size:11px}

/* ---------- Gemensamt för verifikatprototypen ---------- */
.B .detail{position:relative}
.warn{color:var(--sidebar-primary)}
.badge-warn{background:color-mix(in oklch,var(--sidebar-primary) 14%,transparent);color:var(--sidebar-primary)}
.badge-lock{background:var(--muted);color:var(--muted-foreground);border-color:var(--border)}
.dl{display:grid;grid-template-columns:130px 1fr;gap:6px 16px}
.dl dt{color:var(--muted-foreground)}
.dl dd{margin:0}
.link{text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.sec-t{font-size:11px;font-weight:500;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.paper{background:var(--card);border-radius:var(--radius);box-shadow:0 0 0 1px color-mix(in oklch,var(--foreground) 10%,transparent),0 2px 8px rgba(0,0,0,.04);padding:24px 28px;display:flex;flex-direction:column;gap:20px;max-width:860px}
.ro td{padding:6px 8px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:grid;grid-template-columns:18px 130px 1fr;gap:8px;align-items:start}
.hist li .t{color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.ufile{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:calc(var(--radius) * .8)}
.ufile .mf{margin-left:auto;font-size:11px}
.ufile.kompl{border-style:dashed}
.preview{display:grid;place-items:center;gap:6px;background:var(--muted);color:var(--muted-foreground);border-radius:var(--radius);text-align:center}
.drop{display:grid;place-items:center;gap:6px;border:1px dashed var(--ring);border-radius:var(--radius);color:var(--muted-foreground);padding:16px;text-align:center}
.err .input,.input.err{border-color:var(--destructive)}
tr.err td{background:color-mix(in oklch,var(--destructive) 6%,transparent)}
.cell.err{border-color:var(--destructive)}
.ferr{color:var(--destructive);font-size:11px;margin-top:3px;display:flex;gap:4px;align-items:center}
.ferr svg.lucide{width:11px;height:11px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.dialog{width:560px;max-width:94vw;background:var(--popover);border-radius:var(--radius);box-shadow:0 0 0 1px color-mix(in oklch,var(--foreground) 10%,transparent),0 16px 48px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px;padding:18px 20px}
.dialog .ft{display:flex;gap:8px;justify-content:flex-end}
.pick{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.pick label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:calc(var(--radius) * .8);border:1px solid var(--border);cursor:pointer}
.pick label:hover{background:var(--accent)}
.note{display:flex;gap:8px;align-items:flex-start;color:var(--muted-foreground);font-size:12px}
.note svg.lucide{margin-top:2px}
.flex{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}

/* A: kontrollista i en högerspalt */
.A-edit{display:grid;grid-template-columns:1fr 250px;gap:24px;align-items:start}
.rail{position:sticky;top:0;display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--sidebar)}
.rail .chk{display:grid;grid-template-columns:16px 1fr;gap:6px;align-items:start}
.rail .chk.ok{color:var(--muted-foreground)}
.rail .chk.bad{color:var(--foreground)}
.rail .chk.bad svg.lucide{color:var(--destructive)}
.rail .chk.ok svg.lucide{color:var(--success)}
.rail .chk .fix{display:block;font-size:11px;color:var(--muted-foreground)}

/* B: tabell som lista */
.tlist{width:100%;border-collapse:collapse}
.tlist td{padding:6px 6px;border-bottom:1px solid var(--border);vertical-align:top}
.tlist tr{cursor:pointer}
.tlist tr:hover td{background:var(--muted)}
.tlist tr.on td{background:var(--card);box-shadow:inset 0 0 0 0 var(--ring)}
.tlist tr.on td:first-child{box-shadow:inset 2px 0 0 var(--sidebar-primary)}
.tlist th{font-weight:500;color:var(--muted-foreground);text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);font-size:11px}
.B .list.wide{padding:8px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cmp .paper{padding:16px}

/* C: underlag bredvid */
.C-edit{display:grid;grid-template-columns:minmax(260px,42%) 1fr;gap:20px;align-items:start}
.C-edit .left{position:sticky;top:0;display:flex;flex-direction:column;gap:8px}
.C-edit .left .preview{height:420px}
.per{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--muted-foreground);padding:12px 4px 2px}
.per .badge{margin-left:auto}

function sparr(u){const c=co(),m=u.datum.slice(0,7);if(m<=c.last)return `${manad(m)} är låst`;
  const pk=pkFor(c,m),d=dk(pk);if(d.status!=='ej'&&rorTabell(u.rader))return `momsperioden ${pKort(pk).toLowerCase()} är deklarerad`;return null}
function bokforUtkast(id){const u=UTK[S.co].find(x=>x.id===id),sp=sparr(u);if(sp){S.flash=`Kan inte bokföras: ${sp}.`;S.flashFel=true;render();return}
  const nr=nastaNr();VER[S.co].push({nr,datum:u.datum,reg:IDAG_S,typ:'vanlig',text:u.text,rader:u.rader});UTK[S.co]=UTK[S.co].filter(x=>x!==u);S.flash=`${u.text} är bokförd som V${nr}. Rutorna är uppdaterade.`;render()}
function lasManad(m){const c=co();c.last=m;S.flash=`${Manad(m)} är låst.`;render()}
function nastaLasbar(){const c=co(),m=addMan(c.last,1);if(m>=IDAG_S.slice(0,7))return {m,hinder:'den är slut'};const pk=pkFor(c,m);
  return {m,hinder:dk(pk).status==='ej'?`${pKort(pk).toLowerCase()} är deklarerad`:null}}

/* ================= Filer ================= */
function eskd(pk,cid,text){const c=coId(cid),R=berakna(pk,cid);
  const rader=XML_ORDNING.filter(r=>r==='49'||R[r].belopp).map(r=>`    <${RUTA[r].tag}>${R[r].belopp}</${RUTA[r].tag}>`);
  return `<?xml version="1.0" encoding="ISO-8859-1"?>
<eSKDUpload Version="6.0">
  <OrgNr>${c.orgnr}</OrgNr>
  <Moms>
    <Period>${sistaManad(pk).replace('-','')}</Period>
${rader.join('\n')}${text?`\n    <TextUpplysningMoms>${esc(text)}</TextUpplysningMoms>`:''}
  </Moms>
</eSKDUpload>`}
function psRader(pk,cid){const m=new Map();for(const v of VER[cid||S.co])if(v.vat&&manader(pk).includes(v.datum.slice(0,7))){const x=m.get(v.vat)||{vat:v.vat,kund:v.kund,belopp:0};x.belopp=r2(x.belopp-v.rader.find(r=>r[0]===3308)[1]);m.set(v.vat,x)}return [...m.values()]}
function ruta39(pk,cid){return Math.trunc(-sum(radesI(cid||S.co,manader(pk)).filter(x=>{const t=ktRuta(x.k);return t&&t[2]==='39'}),x=>x.b))}
function psFil(pk){const c=co(),k=c.kontakt;return `SKV574008;\n${c.vatnr};${pk.slice(3,5)}-${pk.slice(6)};${k.namn};${(k.tel||'').replace(/[\s-]/g,'')};${k.epost}\n`+psRader(pk).map(x=>`${x.vat};;;${Math.trunc(x.belopp)};`).join('\n')}

/* ================= Gemensamma delar ================= */
const stat=(t,v,heltal)=>`<div class="stat"><span class="mf">${t}</span><b>${heltal?v:kr(v)}</b></div>`;
const flashBox=()=>S.flash?`<div class="alert ${S.flashFel?'destructive':'ok'}">${ic(S.flashFel?'circle-alert':'circle-check')}<div class="t">${esc(S.flash)}</div><button class="btn btn-ghost btn-icon" onclick="S.flash='';render()">${ic('x')}</button></div>`:'';
function meta(pk){const c=co(),d=dk(pk);return `${PTYP[pTyp(pk)]} · ${dkort(manader(pk)[0]+'-01')}–${dkort(sistaDag(pk))} · sista dag ${frist(pk)}${pTyp(pk)==='helar'&&euHandel(S.co,pk)?' (EU-handel)':''} · ${c.metod}${d.inl?' · inlämnad '+d.inl:''}`}
function rubrik(pk){return `<div class="col" style="gap:4px"><div class="flex"><h1>Momsdeklaration ${pLabel(pk)}</h1>${badge(pStatus(pk))}</div><div class="mf">${meta(pk)}</div></div>`}
function knappar(pk){const d=dk(pk),L=kontroller(pk),f=fel(L).length,last=lastaI(pk).length,R=berakna(pk);
  const oppna=last?`<button class="btn btn-outline" disabled title="${lastaI(pk).map(manad).join(', ')} är låst. Fel rättas i en senare momsperiod.">${ic('lock')}Kan inte öppnas igen</button>`:`<button class="btn btn-outline" onclick="S.panel={typ:'oppna',pk:'${pk}',orsak:''};render()">${ic('lock-open')}Öppna igen…</button>`;
  if(d.status==='ej'){if(pagar(pk))return `<button class="btn btn-default" disabled>${ic('stamp')}Deklarera från ${dkort(addMan(sistaManad(pk),1)+'-01')}</button>`;
    return `<button class="btn btn-default" ${f?'disabled':''} onclick="S.panel={typ:'deklarera',pk:'${pk}',text:''};render()">${ic('stamp')}Deklarera${f?` <span class="bcount">${f} kvar</span>`:''}</button>`}
  if(d.status==='deklarerad')return `<div class="flex">${oppna}<button class="btn btn-outline" onclick="S.modal={typ:'xml',pk:'${pk}'};render()">${ic('file-down')}Ladda ner fil</button><button class="btn btn-default" onclick="S.panel={typ:'inlamna',pk:'${pk}',datum:'${IDAG_S}'};render()">${ic('send')}Markera som inlämnad…</button></div>`;
  return `<div class="flex">${oppna}${d.bet?'':`<button class="btn btn-default" onclick="S.panel={typ:'betala',pk:'${pk}',datum:'${IDAG_S}'};render()">${ic('landmark')}${R['49'].belopp>=0?'Bokför betalning…':'Bokför återbetalning…'}</button>`}</div>`}
function kontTab(rader){const d=sum(rader.filter(x=>x[1]>0),x=>x[1]),k=-sum(rader.filter(x=>x[1]<0),x=>x[1]);
  return `<table class="table" style="width:100%"><thead><tr><th>Konto</th><th class="num">Debet</th><th class="num">Kredit</th></tr></thead><tbody>${rader.map(([kk,b])=>`<tr><td>${kk} <span class="mf">${esc(KONTON[kk]||'')}</span></td><td class="num">${b>0?kr(b):''}</td><td class="num">${b<0?kr(-b):''}</td></tr>`).join('')}
  <tr class="sumrow"><td>Summa</td><td class="num">${kr(d)}</td><td class="num">${kr(k)}</td></tr></tbody></table>`}
function panel(pk){const p=S.panel;if(!p||p.pk!==pk)return '';const d=dk(pk),R=berakna(pk),x=`<button class="btn btn-ghost btn-icon" onclick="S.panel=null;render()">${ic('x')}</button>`,av=`<button class="btn btn-outline" onclick="S.panel=null;render()">Avbryt</button>`;let b='';
  const L=kontroller(pk).filter(k=>k.niva==='varn');
  if(p.typ==='deklarera')b=`<div class="flex" style="justify-content:space-between"><h2>Deklarera ${pLabel(pk)}</h2>${x}</div>
    <div class="stats">${stat('Utgående moms',kr0(UTG.reduce((s,r)=>s+R[r].belopp,0))+' kr',1)}${stat('Ingående moms',kr0(R['48'].belopp)+' kr',1)}${stat(R['49'].belopp>=0?'Moms att betala (49)':'Moms att få tillbaka (49)',kr0(Math.abs(R['49'].belopp))+' kr',1)}</div>
    <div class="col" style="gap:6px"><div class="sec-t">Bokförs som V${nastaNr()} · ${sistaDag(pk)} · Momsavräkning</div>${kontTab(avrRader(pk))}</div>
    ${L.map(v=>`<div class="note warn">${ic('triangle-alert')}<span>${esc(v.t)}</span></div>`).join('')}
    <div><label class="label">Upplysning till Skatteverket (valfri, högst 300 tecken)</label><textarea class="input" rows="2" maxlength="300" oninput="S.panel.text=this.value">${esc(p.text)}</textarea></div>
    <div class="note">${ic('info')}<span>Filen och momsrapporten arkiveras som underlag till avräkningen. Därefter kan inget som påverkar rutorna bokföras i ${pLabel(pk)} förrän någon öppnar deklarationen igen. Månaderna ${manader(pk).map(m=>MK[+m.slice(5)-1]).join(', ')} kan låsas när perioden är deklarerad.</span></div>
    <div class="flex" style="justify-content:flex-end">${av}<button class="btn btn-default" onclick="gorDeklarera('${pk}')">${ic('stamp')}Deklarera och bokför V${nastaNr()}</button></div>`;
  if(p.typ==='oppna'){const avr=d.avr.at(-1);b=`<div class="flex" style="justify-content:space-between"><h2>Öppna deklarationen igen?</h2>${x}</div>
    <div class="note">${ic('info')}<span>V${avr} vänds med en rättelse daterad ${sistaDag(pk)}, och perioden blir ej deklarerad. Fil v${d.filer.length} ligger kvar som underlag till den vända avräkningen. När du deklarerar igen skapas en ny, fullständig fil.</span></div>
    ${d.status==='inlamnad'?`<div class="note warn">${ic('triangle-alert')}<span>Deklarationen är inlämnad ${d.inl}. Du behöver lämna en ny deklaration för perioden, och den visas under Att göra tills den är inlämnad.</span></div>`:''}
    ${d.bet?`<div class="note warn">${ic('triangle-alert')}<span>Betalningen V${d.bet.nr} påverkas inte. En skillnad mot den nya deklarationen betalas eller återbetalas för sig.</span></div>`:''}
    <div><label class="label">Orsak (valfri, loggas)</label><input class="input" value="${esc(p.orsak)}" onchange="S.panel.orsak=this.value"></div>
    <div class="flex" style="justify-content:flex-end">${av}<button class="btn btn-default" onclick="oppnaIgen('${pk}',S.panel.orsak)">${ic('lock-open')}Vänd V${avr} och öppna</button></div>`}
  if(p.typ==='inlamna')b=`<div class="flex" style="justify-content:space-between"><h2>Markera som inlämnad</h2>${x}</div>
    <div class="note">${ic('info')}<span>Maya kan inte se uppladdningen hos Skatteverket. Markera när du har laddat upp fil v${d.filer.length} i e-tjänsten och signerat den.</span></div>
    <div class="g3"><div><label class="label">Inlämnad</label><input class="input" type="date" value="${p.datum}" onchange="S.panel.datum=this.value"></div></div>
    <div class="flex" style="justify-content:flex-end">${av}<button class="btn btn-default" onclick="gorInlamna('${pk}')">${ic('send')}Markera som inlämnad</button></div>`;
  if(p.typ==='betala'){const r49=R['49'].belopp;b=`<div class="flex" style="justify-content:space-between"><h2>${r49>=0?'Bokför betalning':'Bokför återbetalning'}</h2>${x}</div>
    <div class="col" style="gap:6px"><div class="sec-t">Bokförs som V${nastaNr()} · ${p.datum}</div>${kontTab([[2650,r49],[1630,-r49]])}</div>
    <div class="g3"><div><label class="label">Datum på skattekontot</label><input class="input" type="date" value="${p.datum}" onchange="S.panel.datum=this.value;render()"></div></div>
    <div class="flex" style="justify-content:flex-end">${av}<button class="btn btn-default" onclick="gorBetala('${pk}')">${ic('landmark')}Bokför V${nastaNr()}</button></div>`}
  return b?`<div class="inl">${b}</div>`:''}
function kontrollLista(pk,allt){const L=kontroller(pk),vis=allt?L:L.filter(x=>x.niva!=='ok'),ok=L.length-L.filter(x=>x.niva!=='ok').length;
  return vis.map(k=>`<div class="chk2 ${k.niva}">${ic(k.niva==='ok'?'circle-check':k.niva==='fel'?'circle-alert':'triangle-alert')}<span>${k.ruta?`<span class="link" onclick="visaRuta('${k.ruta}')">${esc(k.t)}</span>`:esc(k.t)}${k.x?`<span class="x">${esc(k.x)}</span>`:''}</span></div>`).join('')+(!allt&&ok?`<div class="chk2 ok">${ic('circle-check')}<span>${ok} kontroller till är godkända</span></div>`:'')}
function utkastLista(pk){const l=UTK[S.co].filter(u=>manader(pk).includes(u.datum.slice(0,7)));if(!l.length)return '';
  return `<div><div class="sec-t">Utkast i perioden</div>${l.map(u=>{const sp=sparr(u);return `<div class="ut"><span>${u.kanal!=='webb'?`<span class="badge badge-ai">${ic('sparkles')}AI</span> `:''}${esc(u.text)} <span class="mf">· ${dkort(u.datum)}${rorTabell(u.rader)?' · påverkar momsen':''}</span>${sp?`<span class="ferr">${ic('lock')}<span>Kan inte bokföras: ${esc(sp)}.${sp.includes('deklarerad')&&!lastaI(pk).length?` <span class="link" onclick="S.panel={typ:'oppna',pk:'${pk}',orsak:'${esc(u.text)}'};render()">Öppna deklarationen igen…</span>`:''}</span></span>`:''}</span>
    <span class="num">${kr(sum(u.rader.filter(r=>r[1]>0),r=>r[1]))}</span><button class="btn btn-outline" ${sp?'disabled':''} onclick="bokforUtkast('${u.id}')">${ic('stamp')}Bokför</button></div>`}).join('')}</div>`}
function filLista(pk){const d=dk(pk);if(!d.filer.length)return '';
  return `<div><div class="sec-t">Filer (underlag till momsavräkningen)</div>${[...d.filer].reverse().map(f=>`<div class="ufile ${f.ersatt?'kompl':''}">${ic('file-code-2')}<span>${f.namn} · v${f.v}</span><span class="link" onclick="S.modal={typ:'xml',pk:'${pk}',v:${f.v}};render()">visa</span><span class="link" onclick="S.modal={typ:'rapport',pk:'${pk}',v:${f.v}};render()">momsrapport</span><span class="mf">${f.tid} · avräkning V${f.avr}${f.ersatt?' · ersatt':''}</span></div>`).join('')}</div>`}
function verLista(pk){const l=VER[S.co].filter(v=>(v.typ!=='vanlig')&&(v.pk===pk||v.text.endsWith(pLabel(pk))||(v.typ==='avr-r'&&dk(pk).avr.some(a=>v.text.includes('V'+a+' ')))));
  return l.length?`<div><div class="sec-t">Verifikat</div><div class="chips">${l.map(v=>`<span class="badge ${v.typ==='avr-r'||v.rattadAv?'badge-rattad':'badge-bokford'}">${esc(v.text.split(' ')[0])} V${v.nr} · ${v.datum}${v.rattadAv?' · vänd':''}</span>`).join('')}</div></div>`:''}
function historik(pk){const l=dk(pk).hist;return l.length?`<div><div class="sec-t">Historik</div><ul class="hist">${[...l].reverse().map(x=>`<li>${ic(x.i)}<span class="t">${x.tid}</span><span>${esc(x.t)} <span class="mf">· ${esc(x.vem)}</span></span></li>`).join('')}</ul></div>`:''}
function lasning(pk){const c=co(),n=nastaLasbar(),ms=manader(pk);
  return `<div class="flex" style="flex-wrap:wrap;gap:6px">${ms.map(m=>`<span class="mchip ${m<=c.last?'ok':''}">${ic(m<=c.last?'lock':'lock-open')}${MK[+m.slice(5)-1]} ${m<=c.last?'låst':'öppen'}</span>`).join('')}
    ${ms.includes(n.m)?(n.hinder?`<span class="mf">${Manad(n.m)} kan låsas när ${esc(n.hinder)}.</span>`:`<button class="btn btn-outline" onclick="lasManad('${n.m}')">${ic('lock')}Lås ${MAN[+n.m.slice(5)-1]}</button>`):''}</div>`}
function visaRuta(r){if(S.variant==='C'){S.open['r'+r]=true;render();setTimeout(()=>document.getElementById('rr-'+r)?.scrollIntoView({behavior:'smooth',block:'center'}),30)}else{S.ruta=r;if(S.variant==='B')S.modal={typ:'ruta'};render()}}
function drill(pk,r){const R=berakna(pk),x=R[r],K=Object.entries(x.konton);
  if(r==='49')return `<div class="note">${ic('info')}<span>Ruta 49 räknas: utgående moms (${UTG.filter(q=>R[q].belopp).map(q=>q+': '+kr0(R[q].belopp)).join(', ')||'0'}) minus ingående moms (48: ${kr0(R['48'].belopp)}) = ${kr0(R['49'].belopp)} kr. Momsavräkningen för över den till 2650.</span></div>`;
  const iv=KT.filter(t=>t[2]===r).map(t=>t[0]===t[1]?t[0]:t[0]+'–'+t[1]).join(', ');
  return `<div class="mf" style="font-size:12px">Ruta ${r} räknas ur ${iv?'konto '+iv:'inga konton'} enligt kopplingstabellen för moms v1. Beloppet är kontonas saldo i perioden, avrundat nedåt till hela kronor.</div>
  <table class="table drill" style="width:100%"><thead><tr><th>Konto / verifikat</th><th>Datum</th><th class="num">Belopp</th></tr></thead><tbody>
  ${K.map(([k,o])=>`<tr class="k" onclick="S.open['k${k}']=!S.open['k${k}'];render()"><td>${ic(S.open['k'+k]?'chevron-down':'chevron-right')} ${k} ${esc(KONTON[k]||'')}</td><td class="mf">${o.rader.length} rader</td><td class="num">${kr(o.saldo)}</td></tr>
    ${S.open['k'+k]?o.rader.map(z=>`<tr class="v"><td>V${z.v.nr} ${esc(z.v.text)}${z.v.manuell?' <span class="badge badge-warn">manuellt</span>':''}</td><td>${z.v.datum}</td><td class="num">${kr(o.intervall[3]*z.b)}</td></tr>`).join(''):''}`).join('')||`<tr><td colspan="3" class="mf">Inga bokförda rader i perioden.</td></tr>`}
  <tr class="sumrow"><td>Ruta ${r}</td><td></td><td class="num">${kr0(x.belopp)}</td></tr></tbody></table>`}

/* ================= Variant A: Blanketten ================= */
function blankett(pk){const R=berakna(pk),fe=new Set(fel(kontroller(pk)).map(k=>k.ruta).filter(Boolean)),c=co();
  return `<div class="inv"><div class="h"><div><div class="tt">Mervärdesskattedeklaration</div><div>${esc(c.namn)} · ${c.orgnr}</div></div><div class="kv"><span>Redovisningsperiod</span><span>${sistaManad(pk).replace('-','')}</span><span>Momsperiod</span><span>${pLabel(pk)}</span></div></div>
  <div class="blk">${RUTOR.map(([a,t,l])=>`<div class="sek"><div class="sh"><span class="bk">${a}</span>${t}</div>${l.map(([r,tt])=>{const v=R[r].belopp;
    return `<div class="rr ${v?'':'zero'} ${r==='49'?'big':''} ${S.ruta===r?'on':''} ${fe.has(r)?'fel':''}" onclick="visaRuta('${r}')"><span class="nr">${r}</span><span>${tt}</span><span class="bel">${v||r==='49'?kr0(v):''}</span></div>`}).join('')}</div>`).join('')}</div></div>`}
function sidaA(pk){const L=kontroller(pk),ej=L.filter(x=>x.niva!=='ok');
  return `<div class="flex" style="justify-content:space-between;align-items:flex-start">${rubrik(pk)}${knappar(pk)}</div>${panel(pk)}
  ${ej.length?`<div class="alert ${fel(L).length?'destructive':''}" style="${fel(L).length?'':'background:var(--muted)'}">${ic(fel(L).length?'circle-alert':'triangle-alert')}<div style="flex:1"><div class="t">${fel(L).length?fel(L).length+' att åtgärda innan perioden kan deklareras':'Kontroller med varningar'}</div>${kontrollLista(pk)}</div></div>`:`<div class="note">${ic('circle-check')}<span>Alla kontroller är godkända.</span></div>`}
  <div class="flex" style="justify-content:space-between"><span class="mf">Klicka på en ruta för att se kontona och verifikaten bakom den.</span><span class="mf">${dk(pk).status==='ej'?'Förhandsgranskning, räknas om vid varje bokföring':'Som deklarerad '+dk(pk).dekl}</span></div>
  ${blankett(pk)}
  ${utkastLista(pk)}
  <div><div class="sec-t">Låsning</div>${lasning(pk)}</div>
  ${filLista(pk)}${verLista(pk)}${historik(pk)}
  ${S.ruta?`<div class="drawer"><div class="dh"><b>Ruta ${S.ruta} · ${esc(RUTA[S.ruta].t)}</b><button class="btn btn-ghost btn-icon" onclick="S.ruta=null;render()">${ic('x')}</button></div><div class="db" style="background:var(--background)">${drill(pk,S.ruta)}</div></div>`:''}`}

/* ================= Variant B: Kedjan ================= */
function sidaB(pk){const d=dk(pk),L=kontroller(pk),R=berakna(pk),f=fel(L).length,v=L.filter(x=>x.niva==='varn').length,ut=UTK[S.co].filter(u=>manader(pk).includes(u.datum.slice(0,7))).length;
  const st=(cls,t,dd,a)=>`<div class="st ${cls}" onclick="document.getElementById('${a}')?.scrollIntoView({behavior:'smooth'})"><span class="t">${t}</span><span class="d">${dd}</span></div>`,ar='<span class="ar"></span>';
  const sen=IDAG_S>frist(pk);
  const chain=`<div class="chain">${st(pagar(pk)?'cur':ut?'cur':'ok',ic('book-open')+'Bokföring',pagar(pk)?'pågår till '+dkort(sistaDag(pk)):ut?ut+' utkast kvar':'klar','b-bok')}${ar}
    ${st(f?'bad':v?'cur':'ok',ic('list-checks')+'Kontroller',f?f+' fel':v?v+' varningar':'godkända','b-kontr')}${ar}
    ${st(d.status!=='ej'?'ok':pagar(pk)?'':'cur',ic('stamp')+'Deklarerad',d.status!=='ej'?'V'+d.avr.at(-1)+' · '+dkort(d.dekl):d.nyLamnas?'öppnad igen':'ej deklarerad','b-dekl')}${ar}
    ${st(d.status==='inlamnad'?'ok':sen?'bad':d.status==='deklarerad'?'cur':'',ic('send')+'Inlämnad',d.status==='inlamnad'?dkort(d.inl):'senast '+dkort(frist(pk)),'b-fil')}${ar}
    ${st(d.bet?'ok':d.status==='inlamnad'?'cur':'',ic('landmark')+(R['49'].belopp>=0?'Betald':'Återbetald'),d.bet?'V'+d.bet.nr+' · '+dkort(d.bet.datum):kr0(Math.abs(R['49'].belopp))+' kr','b-bet')}</div>`;
  const mansum=m=>{const x=radesI(S.co,[m]);const u=-sum(x.filter(z=>{const t=ktRuta(z.k);return t&&UTG.includes(t[2])}),z=>z.b),i=sum(x.filter(z=>z.k>=2640&&z.k<=2649),z=>z.b);return {u,i}};
  const nonzero=Object.keys(RUTA).filter(r=>R[r].belopp||r==='49'),vis=S.alla?XML_ORDNING:XML_ORDNING.filter(r=>nonzero.includes(r));
  return `<div class="flex" style="justify-content:space-between;align-items:flex-start">${rubrik(pk)}${knappar(pk)}</div>${chain}${panel(pk)}
  <div id="b-bok" class="mcard"><div class="mh"><h2>Bokföring i perioden</h2></div>
    <div class="mgrid">${manader(pk).map(m=>{const s=mansum(m),u=UTK[S.co].filter(x=>x.datum.slice(0,7)===m).length,l=m<=co().last;return `<div class="mbox ${l?'locked':''}"><b>${Manad(m)} ${l?ic('lock'):''}</b><div class="r"><span class="mf">Utgående moms</span><span class="num">${kr0(s.u)}</span></div><div class="r"><span class="mf">Ingående moms</span><span class="num">${kr0(s.i)}</span></div><div class="r"><span class="mf">Netto</span><b class="num">${kr0(s.u-s.i)}</b></div>${u?`<span class="mchip warn">${u} utkast</span>`:''}${m>=IDAG_S.slice(0,7)?'<span class="mchip">pågår</span>':''}</div>`}).join('')}</div>
    ${utkastLista(pk)}<div>${lasning(pk)}</div></div>
  <div id="b-kontr" class="mcard"><div class="mh"><h2>Kontroller</h2><span class="mf">formella kontroller stoppar, rimlighetskontroller varnar</span></div>${kontrollLista(pk,true)}</div>
  <div id="b-dekl" class="mcard"><div class="mh"><h2>Deklarationen</h2><span class="link" onclick="S.alla=!S.alla;render()">${S.alla?'visa bara rutor med belopp':'visa alla rutor'}</span></div>
    <div class="rgrid">${vis.map(r=>`<div class="rc" onclick="visaRuta('${r}')"><span class="n">${r}</span><span>${esc(RUTA[r].t)}</span><b class="num">${kr0(R[r].belopp)}</b></div>`).join('')}</div></div>
  <div id="b-fil" class="mcard"><div class="mh"><h2>Fil och inlämning</h2></div>${d.filer.length?filLista(pk):`<div class="mf">Filen skapas när perioden deklareras. Den laddas upp i Skatteverkets e-tjänst och signeras där.</div>`}</div>
  <div id="b-bet" class="mcard"><div class="mh"><h2>Skattekontot</h2></div>${d.bet?`<div class="mf">${R['49'].belopp>=0?'Betalningen':'Återbetalningen'} är bokförd som V${d.bet.nr} ${d.bet.datum} (2650 mot 1630).</div>`:`<div class="mf">${kr0(Math.abs(R['49'].belopp))} kr ${R['49'].belopp>=0?'att betala':'att få tillbaka'} senast ${frist(pk)}. Bokförs för sig när beloppet syns på skattekontot.</div>`}</div>
  ${verLista(pk)}${historik(pk)}`}

/* ================= Variant C: Avstämningen ================= */
function sidaC(pk){const R=berakna(pk),ms=manader(pk),L=kontroller(pk),fe=new Set(fel(L).map(k=>k.ruta).filter(Boolean));
  const per=(o,m)=>sum(o.rader.filter(z=>z.v.datum.slice(0,7)===m),z=>o.intervall[3]*z.b);
  const rutor=XML_ORDNING.filter(r=>r!=='49'&&(R[r].belopp||Object.keys(R[r].konton).length||fe.has(r)||(S.alla)));
  const rows=rutor.map(r=>{const x=R[r],K=Object.entries(x.konton),open=S.open['r'+r]!==false;
    return `<tr id="rr-${r}" class="rh ${fe.has(r)?'fel':''}" onclick="S.open['r${r}']=!${open};render()" style="cursor:pointer"><td>${ic(open?'chevron-down':'chevron-right')} <b>${r}</b> ${esc(RUTA[r].t)}</td>${ms.map(m=>`<td class="num">${kr0(sum(K,([,o])=>per(o,m)))}</td>`).join('')}<td class="num"><b>${kr0(x.belopp)}</b></td></tr>
    ${open?K.map(([k,o])=>`<tr class="kr" onclick="S.open['k${k}']=!S.open['k${k}'];render()"><td>${k} ${esc(KONTON[k]||'')}</td>${ms.map(m=>`<td class="num">${kr(per(o,m))}</td>`).join('')}<td class="num">${kr(o.saldo)}</td></tr>
      ${S.open['k'+k]?o.rader.map(z=>`<tr class="vr"><td>V${z.v.nr} ${esc(z.v.text)}${z.v.manuell?' <span class="badge badge-warn">manuellt</span>':''}</td>${ms.map(m=>`<td class="num">${z.v.datum.slice(0,7)===m?kr(o.intervall[3]*z.b):''}</td>`).join('')}<td class="mf">${z.v.datum}</td></tr>`).join(''):''}`).join('')+(fe.has(r)?`<tr><td colspan="${ms.length+2}"><span class="ferr">${ic('circle-alert')}<span>${esc(fel(L).find(k=>k.ruta===r).t)}</span></span></td></tr>`:''):''}`}).join('');
  const side=`<div class="side"><div class="rail"><div class="flex" style="justify-content:space-between"><b>Rutorna</b>${badge(pStatus(pk))}</div>
    <div class="rlist">${XML_ORDNING.filter(r=>r!=='49'&&R[r].belopp).map(r=>`<span class="n">${r}</span><span class="link" onclick="visaRuta('${r}')">${esc(RUTA[r].t.length>34?RUTA[r].t.slice(0,32)+'…':RUTA[r].t)}</span><span class="b">${kr0(R[r].belopp)}</span>`).join('')}
    <span class="n tot">49</span><span class="tot">${R['49'].belopp>=0?'Att betala':'Att få tillbaka'}</span><span class="b tot">${kr0(R['49'].belopp)}</span></div></div>
    <div class="rail"><b>Kontroller</b>${kontrollLista(pk)}</div>
    <div class="rail"><b>Sista dag ${frist(pk)}</b><div>${knappar(pk).replace('<div class="flex">','<div class="col" style="gap:6px;align-items:stretch">')}</div></div></div>`;
  return `<div class="flex" style="justify-content:space-between;align-items:flex-start">${rubrik(pk)}</div>${panel(pk)}
  <div class="av"><div class="col" style="gap:12px"><div class="flex" style="justify-content:space-between"><span class="mf">Varje ruta är saldot på kontona i kopplingstabellen. Klicka på ett konto för verifikaten.</span><span class="link" onclick="S.alla=!S.alla;render()">${S.alla?'dölj tomma rutor':'visa tomma rutor'}</span></div>
    <table class="table" style="width:100%"><thead><tr><th>Ruta / konto</th>${ms.map(m=>`<th class="num">${MK[+m.slice(5)-1]}</th>`).join('')}<th class="num">Perioden</th></tr></thead><tbody>${rows}
    <tr class="rh"><td><b>49</b> Moms att betala eller få tillbaka</td>${ms.map(()=>'<td></td>').join('')}<td class="num"><b>${kr0(R['49'].belopp)}</b></td></tr></tbody></table>
    <div><div class="sec-t">Momsavräkningen ${dk(pk).status==='ej'?'som bokförs vid Deklarera':'V'+dk(pk).avr.at(-1)}</div>${kontTab(dk(pk).status==='ej'?avrRader(pk):VER[S.co].find(v=>v.nr===dk(pk).avr.at(-1)).rader)}</div>
    ${utkastLista(pk)}<div><div class="sec-t">Låsning</div>${lasning(pk)}</div>${filLista(pk)}${verLista(pk)}${historik(pk)}</div>${side}</div>`}

/* ================= Periodisk sammanställning ================= */
function psd(pk){return PSD[S.co][pk]||(PSD[S.co][pk]={status:'ej',filer:[],hist:[]})}
function psKvartal(){const ut=[];let m=co().visaFran;while(m<=IDAG_S.slice(0,7)){const q='Q'+m.slice(0,4)+'-'+Math.ceil(+m.slice(5)/3);if(!ut.includes(q))ut.push(q);m=addMan(m,1)}
  return ut.reverse().filter(q=>psRader(q).length||PSD[S.co][q])}
const psFrist=q=>addMan(sistaManad(q),1)+'-25';
function psStatus(q){const d=psd(q);if(d.status==='inlamnad')return ['inlämnad','badge-betald'];if(d.status==='deklarerad')return IDAG_S>psFrist(q)?['ej inlämnad, försenad','badge-forfallen']:['fil skapad','badge-bokford'];
  if(pagar(q))return ['pågår','badge-lock'];return IDAG_S>psFrist(q)?['försenad','badge-forfallen']:['ej deklarerad','badge-warn']}
function psSida(q){const d=psd(q),L=psRader(q),c=co(),s=Math.trunc(sum(L,x=>x.belopp)),r39=ruta39(q),k=c.kontakt,hinder=[];
  if(!k.namn)hinder.push('Kontaktnamn saknas');if(!k.tel)hinder.push('Telefonnummer till kontaktpersonen saknas');if(pagar(q))hinder.push(`Kvartalet pågår till ${sistaDag(q)}`);
  const p=S.panel&&S.panel.pk===q?S.panel:null;
  return `<div class="flex" style="justify-content:space-between;align-items:flex-start"><div class="col" style="gap:4px"><div class="flex"><h1>Periodisk sammanställning ${pLabel(q)}</h1>${badge(psStatus(q))}</div><div class="mf">Tjänster till EU · kvartal oavsett momsperiod · sista dag ${psFrist(q)} · lämnas som fil i e-tjänsten Filöverföring</div></div>
    ${d.status==='ej'?`<button class="btn btn-default" ${hinder.length?'disabled':''} onclick="psDekl('${q}')">${ic('file-down')}Skapa fil${hinder.length?` <span class="bcount">${hinder.length} kvar</span>`:''}</button>`:d.status==='deklarerad'?`<div class="flex"><button class="btn btn-outline" onclick="psd('${q}').status='ej';psd('${q}').filer.forEach(f=>f.ersatt=true);render()">${ic('lock-open')}Öppna igen</button><button class="btn btn-default" onclick="S.panel={typ:'psinl',pk:'${q}',datum:'${IDAG_S}'};render()">${ic('send')}Markera som inlämnad…</button></div>`:''}</div>
  ${p&&p.typ==='psinl'?`<div class="inl"><h2>Markera som inlämnad</h2><div class="note">${ic('info')}<span>Överföringen i Filöverföring är själva inlämningen; det finns inget signeringssteg.</span></div><div class="g3"><div><label class="label">Inlämnad</label><input class="input" type="date" value="${p.datum}" onchange="S.panel.datum=this.value"></div></div><div class="flex" style="justify-content:flex-end"><button class="btn btn-outline" onclick="S.panel=null;render()">Avbryt</button><button class="btn btn-default" onclick="const d=psd('${q}');d.status='inlamnad';d.inl=S.panel.datum;d.hist.push(h(nu(),ANV,'Markerade som inlämnad '+S.panel.datum,'send'));S.panel=null;render()">${ic('send')}Markera som inlämnad</button></div></div>`:''}
  ${hinder.length&&d.status==='ej'?`<div class="alert destructive">${ic('circle-alert')}<div><div class="t">Filen kan inte skapas</div><ul>${hinder.map(x=>`<li>${esc(x)}${x.includes('Telefon')||x.includes('Kontakt')?' <span class="link" onclick="go(\'#/moms/installningar\')">Inställningar för moms</span>':''}</li>`).join('')}</ul></div></div>`:''}
  ${s!==r39?`<div class="note warn">${ic('triangle-alert')}<span>Summan ${kr0(s)} kr avviker ${kr0(r39-s)} kr från ruta 39 för ${pLabel(q)} (${kr0(r39)} kr). Försäljning på 3308 som inte kommer från kundreskontran saknar köparens momsreg-nr och kommer inte med.</span></div>`:`<div class="note">${ic('circle-check')}<span>Summan stämmer med ruta 39 för kvartalet.</span></div>`}
  <table class="table" style="width:100%"><thead><tr><th>Köpare</th><th>Momsreg-nr</th><th class="num">Varor</th><th class="num">Trepart</th><th class="num">Tjänster</th></tr></thead><tbody>${L.map(x=>`<tr><td>${esc(x.kund)}</td><td>${x.vat}</td><td></td><td></td><td class="num">${kr0(Math.trunc(x.belopp))}</td></tr>`).join('')}<tr class="sumrow"><td>Summa</td><td></td><td></td><td></td><td class="num">${kr0(s)}</td></tr></tbody></table>
  <div class="mf">Raderna räknas ur kundfakturor med omvänd skattskyldighet för EU-tjänst i kundreskontran. En rättelse är en ny fil för samma kvartal där köpare som försvunnit får beloppet 0.</div>
  ${d.filer.length?`<div><div class="sec-t">Filer</div>${[...d.filer].reverse().map(f=>`<div class="ufile ${f.ersatt?'kompl':''}">${ic('file-text')}<span>ps_${c.vatnr}_${q.slice(3,5)}-${q.slice(6)}.txt · v${f.v}</span><span class="link" onclick="S.modal={typ:'ps',pk:'${q}'};render()">visa</span><span class="mf">${f.tid}${f.ersatt?' · ersatt':''}</span></div>`).join('')}</div>`:''}
  ${d.hist.length?`<div><div class="sec-t">Historik</div><ul class="hist">${[...d.hist].reverse().map(x=>`<li>${ic(x.i)}<span class="t">${x.tid}</span><span>${esc(x.t)} <span class="mf">· ${esc(x.vem)}</span></span></li>`).join('')}</ul></div>`:''}`}
function psDekl(q){const d=psd(q),t=nu();d.filer.forEach(f=>f.ersatt=true);d.filer.push({v:d.filer.length+1,tid:t});d.status='deklarerad';d.hist.push(h(t,ANV,`Skapade filen v${d.filer.length}`,'file-down'));S.flash='Filen är skapad. Ladda upp den i Filöverföring hos Skatteverket.';render()}

/* ================= Inställningar ================= */
function installningar(){const c=co(),nu_=momsTyp(c,IDAG_S.slice(0,7)),p=S.panel&&S.panel.typ==='per'?S.panel:null,nasta=addMan(sistaManad(pkFor(c,IDAG_S.slice(0,7))),1);
  return `<div class="col" style="gap:4px"><h1>Inställningar för moms</h1><div class="mf">${esc(c.namn)} · ${c.vatnr}</div></div>
  <div class="mcard"><div class="mh"><h2>Momsperiod</h2><button class="btn btn-outline" onclick="S.panel={typ:'per',ny:'${nu_==='manad'?'kvartal':'manad'}'};render()">${ic('pencil')}Ändra…</button></div>
    <div><b>${PTYP[nu_]}</b> <span class="mf">· gäller sedan ${c.momsper.filter(x=>x.typ===nu_).at(-1).fran}</span></div>
    ${p?`<div class="inl"><h2>Ändra momsperiod</h2><div class="g3"><div><label class="label">Ny momsperiod</label><select class="select" onchange="S.panel.ny=this.value">${Object.entries(PTYP).filter(([k])=>k!==nu_).map(([k,t])=>`<option value="${k}" ${p.ny===k?'selected':''}>${t}</option>`).join('')}</select></div><div><label class="label">Gäller från</label><input class="input" readonly value="${nasta}-01"></div></div>
      <div class="note">${ic('info')}<span>Ett byte gäller från början av nästa momsperiod och loggas. Skatteverket måste ha beslutat om den nya perioden; Maya kontrollerar inte det.</span></div>
      <div class="flex" style="justify-content:flex-end"><button class="btn btn-outline" onclick="S.panel=null;render()">Avbryt</button><button class="btn btn-default" onclick="co().momsper.push({typ:S.panel.ny,fran:'${nasta}',vem:ANV,tid:nu()});S.panel=null;S.flash='Momsperioden är ändrad från ${nasta}-01.';render()">Spara</button></div></div>`:''}
    <table class="table" style="width:100%"><thead><tr><th>Momsperiod</th><th>Gäller från</th><th>Ändrad</th></tr></thead><tbody>${[...c.momsper].reverse().map(x=>`<tr><td>${PTYP[x.typ]}</td><td>${x.fran}</td><td class="mf">${x.tid} · ${esc(x.vem)}</td></tr>`).join('')}</tbody></table></div>
  <div class="mcard"><div class="mh"><h2>Kontaktperson för periodisk sammanställning</h2></div><div class="g3"><div><label class="label">Namn (högst 35 tecken)</label><input class="input" maxlength="35" value="${esc(c.kontakt.namn)}" onchange="co().kontakt.namn=this.value"></div><div><label class="label">Telefon (högst 17 tecken)</label><input class="input ${c.kontakt.tel?'':'err'}" maxlength="17" value="${esc(c.kontakt.tel)}" onchange="co().kontakt.tel=this.value;render()"></div><div><label class="label">E-post</label><input class="input" value="${esc(c.kontakt.epost)}" onchange="co().kontakt.epost=this.value"></div></div></div>
  <div class="mcard"><div class="mh"><h2>Kopplingstabell för moms v1</h2><span class="mf">inbyggd, samma för alla företag · systemdokumentation</span></div>
    <table class="table" style="width:100%"><thead><tr><th>Konton</th><th>Ruta</th><th>Saldo räknas som</th></tr></thead><tbody>${KT.map(([f,t,r,s])=>`<tr><td>${f===t?f:f+'–'+t}</td><td>${r} <span class="mf">${esc(RUTA[r].t)}</span></td><td class="mf">${s<0?'kredit':'debet'}</td></tr>`).join('')}</tbody></table></div>`}

/* ================= Lista ================= */
function lista(rt){const P=perioder(),Q=psKvartal();
  const item=pk=>{const R=berakna(pk),d=dk(pk),f=fel(kontroller(pk)).length;return `<a class="item ${rt.id==='p-'+pk?'on':''}" href="#/moms/p-${pk}" style="padding:8px 10px"><div class="top"><span>${pKort(pk)}</span><span class="num">${kr0(R['49'].belopp)} kr</span></div>
    <div class="meta">${badge(pStatus(pk))}<span>${d.status==='inlamnad'?(d.bet?'betald':'ej betald'):'senast '+dkort(frist(pk))}</span>${f&&d.status==='ej'&&!pagar(pk)?`<span class="diff-bad">${f} fel</span>`:''}</div></a>`};
  return `<div class="lh"><h2>Moms</h2><span class="mf">${PTYP[momsTyp(co(),IDAG_S.slice(0,7))].toLowerCase()}</span></div>
  <div class="sect">${ic('file-code-2')}Momsdeklarationer</div>${P.map(item).join('')}
  ${Q.length?`<div class="sect">${ic('globe')}Periodisk sammanställning</div>${Q.map(q=>`<a class="item ${rt.id==='ps-'+q?'on':''}" href="#/moms/ps-${q}" style="padding:8px 10px"><div class="top"><span>${pKort(q)}</span><span class="num">${kr0(Math.trunc(sum(psRader(q),x=>x.belopp)))} kr</span></div><div class="meta">${badge(psStatus(q))}<span>senast ${dkort(psFrist(q))}</span></div></a>`).join('')}`:''}
  <div class="sect">${ic('settings')}Inställningar</div><a class="item plain ${rt.id==='installningar'?'on':''}" href="#/moms/installningar" style="padding:8px 10px"><div class="top"><span>Momsperiod, kontaktperson och kopplingstabell</span></div></a>`}

/* ================= Skal (variant D från gränssnittsprototypen) ================= */
const VARIANTS={A:{namn:'Blanketten',sida:sidaA},B:{namn:'Kedjan',sida:sidaB},C:{namn:'Avstämningen',sida:sidaC}};
const NAV=[['inkorg','Att göra'],['verifikat','Verifikat'],['kundfakturor','Kundfakturor'],['leverantorsfakturor','Leverantörsfakturor'],['lon','Lön'],['moms','Moms'],['rapporter','Rapporter']];
function coMenu(){return `<div class="dropdown"><div class="lbl">Företag</div>${FORETAG.map(f=>`<button class="mi" onclick="byt('${f.id}')"><span class="logo sm">${initialer(f.namn)}</span><span style="flex:1"><b style="font-weight:500">${esc(f.namn)}</b><br><span class="mf">${f.orgnr}</span></span>${f.id===S.co?ic('check'):''}</button>`).join('')}</div>`}
function byt(id){S.co=id;S.coMenu=false;S.flash='';S.panel=null;S.ruta=null;S.open={};go('#/moms/p-'+forvald())}
function forvald(){return perioder().find(p=>dk(p).status!=='inlamnad'&&!pagar(p))||perioder()[0]}
function detalj(rt){const id=rt.id;if(!id)return null;
  if(id==='installningar')return installningar();
  if(id.startsWith('ps-'))return psSida(id.slice(3));
  if(id.startsWith('p-'))return VARIANTS[S.variant].sida(id.slice(2));return null}
function skal(rt){const mod=rt.mod;let page;
  if(mod!=='moms')page=`<div style="padding:24px"><div class="placeholder">${ic('construction')}Sidan prototypas i ett eget ticket.</div></div>`;
  else{const inner=detalj(rt);page=`<div class="split"><div class="list">${lista(rt)}</div><div class="detail">${flashBox()}${inner||`<div class="empty"><div>${ic('mouse-pointer-click','style="width:20px;height:20px"')}<p>Välj något i listan</p></div></div>`}</div></div>`}
  return `<div class="B"><header>
    <span class="brand"><span class="logo" style="width:24px;height:24px">M</span></span><span class="mf">/</span>
    <div class="co"><button class="btn btn-ghost" onclick="S.coMenu=!S.coMenu;render()">${esc(co().namn)}${ic('chevrons-up-down')}</button>${S.coMenu?coMenu():''}</div>
    <nav>${NAV.map(([k,t])=>`<a href="#/${k}" class="${mod===k?'on':''}">${t}</a>`).join('')}</nav>
    <div class="right"><span class="search" onclick="palett()">${ic('search')}Sök verifikat, period…<kbd>⌘K</kbd></span><button class="btn btn-ghost btn-icon" onclick="tema()" title="Ljust/mörkt">${ic('sun-moon')}</button></div>
  </header>${page}</div>${modal()}${S.pal?pal():''}`}
function modal(){const m=S.modal;if(!m)return '';const x=`<button class="btn btn-ghost btn-icon" onclick="S.modal=null;render()">${ic('x')}</button>`;let t='',b='';
  if(m.typ==='xml'){const d=dk(m.pk),f=m.v?d.filer.find(z=>z.v===m.v):d.filer.at(-1);t=f.namn+' · v'+f.v;b=`<pre class="xml">${esc(f.xml)}</pre><div class="mf">ISO-8859-1. Ladda upp i e-tjänsten Lämna momsdeklaration → Deklarera via fil och signera med e-legitimation.</div>`}
  if(m.typ==='rapport'){const d=dk(m.pk),f=m.v?d.filer.find(z=>z.v===m.v):d.filer.at(-1),R=f.rutor,c=co();t='Momsrapport '+pLabel(m.pk)+' · v'+f.v;
    b=`<div class="inv">${f.ersatt?'<div class="wm">ERSATT</div>':''}<div class="h"><div><div class="tt">Momsrapport</div><div>${esc(c.namn)} · ${c.orgnr}</div></div><div class="kv"><span>Momsperiod</span><span>${pLabel(m.pk)}</span><span>Underlag till</span><span>V${f.avr}</span><span>Skapad</span><span>${f.tid}</span></div></div>
    <table><thead><tr><th>Ruta</th><th>Konto</th><th class="r">Belopp</th></tr></thead><tbody>${XML_ORDNING.filter(r=>R[r].belopp||r==='49').map(r=>`<tr><td><b>${r}</b> ${esc(RUTA[r].t)}</td><td></td><td class="r"><b>${kr0(R[r].belopp)}</b></td></tr>${Object.entries(R[r].konton).map(([k,o])=>`<tr><td></td><td>${k} ${esc(KONTON[k]||'')}</td><td class="r">${kr(o.saldo)}</td></tr>`).join('')}`).join('')}</tbody></table>
    <div class="foot">Rutorna räknas ur kontonas saldo enligt kopplingstabellen för moms v1. Filen och rapporten genereras aldrig om.</div></div>`}
  if(m.typ==='ps'){t='Periodisk sammanställning '+pLabel(m.pk);b=`<pre class="xml">${esc(psFil(m.pk))}</pre><div class="mf">SKV574008, semikolonavgränsad. Ladda upp i e-tjänsten Filöverföring.</div>`}
  if(m.typ==='ruta'){const pk=route().id.slice(2);t='Ruta '+S.ruta+' · '+RUTA[S.ruta].t;b=drill(pk,S.ruta)}
  return `<div class="pal-bg" onclick="if(event.target===this){S.modal=null;render()}"><div class="dialog" style="width:680px;max-height:86vh;overflow:auto"><div class="flex" style="justify-content:space-between"><h2>${esc(t)}</h2>${x}</div>${b}</div></div>`}
function opts(){const q=S.palQ.toLowerCase();
  const o=[...perioder().map(p=>({g:'Momsdeklarationer',t:'Moms '+pLabel(p),amt:kr0(berakna(p)['49'].belopp),i:'file-code-2',run:()=>go('#/moms/p-'+p)})),...psKvartal().map(p=>({g:'Periodisk sammanställning',t:'PS '+pLabel(p),i:'globe',run:()=>go('#/moms/ps-'+p)})),{g:'Inställningar',t:'Momsperiod och kopplingstabell',i:'settings',run:()=>go('#/moms/installningar')}];
  if(!q)return o;const norm=t=>String(t).toLowerCase().replace(/\s/g,'');return o.filter(x=>norm(x.t+' '+(x.amt||'')).includes(norm(q)))}
function pal(){const o=opts();let g='';
  return `<div class="pal-bg" onclick="if(event.target===this){S.pal=false;render()}"><div class="pal"><div class="in">${ic('search')}<input id="palq" placeholder="Sök period…" value="${esc(S.palQ)}" oninput="S.palQ=this.value;S.palI=0;render();const e=document.getElementById('palq');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div>
    <div class="ls">${o.map((x,i)=>{const hh=x.g!==g?(g=x.g,`<div class="grp">${x.g}</div>`):'';return hh+`<div class="opt ${i===S.palI?'on':''}" onclick="runOpt(${i})">${ic(x.i)}<span class="t">${esc(x.t)}</span>${x.amt?`<span class="amt">${x.amt}</span>`:''}</div>`}).join('')||'<div class="opt mf">Inga träffar.</div>'}</div></div></div>`}
function runOpt(i){const o=opts()[i];S.pal=false;S.palQ='';o&&o.run();render()}
function palett(){S.pal=true;S.palQ='';S.palI=0;render();setTimeout(()=>document.getElementById('palq')?.focus())}

/* ================= Render, tema, tangenter ================= */
function render(){const det=document.querySelector('.detail'),sc=det?det.scrollTop:0;
  document.getElementById('app').innerHTML=skal(route());window.lucide&&lucide.createIcons();
  const d=document.querySelector('.detail');if(d)d.scrollTop=sc;
  const keys=Object.keys(VARIANTS),V=VARIANTS[S.variant];
  document.getElementById('proto-switcher').innerHTML=`<button onclick="cyk(-1)">←</button><span class="lbl">PROTOTYP · ${S.variant} (${V.namn}) · ${keys.indexOf(S.variant)+1}/${keys.length}</span><button onclick="cyk(1)">→</button>`}
function cyk(d){const k=Object.keys(VARIANTS);S.variant=k[(k.indexOf(S.variant)+d+k.length)%k.length];S.coMenu=false;S.pal=false;S.modal=null;S.ruta=null;S.alla=false;
  const p=new URLSearchParams(location.search);p.set('variant',S.variant);history.replaceState(null,'','?'+p+location.hash);render()}
function tema(){const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'}
let senast=null;
window.addEventListener('hashchange',()=>{const rt=route();S.coMenu=false;S.modal=null;if(rt.id!==senast){S.panel=null;S.ruta=null;S.open={}}render();senast=rt.id;S.flash='';S.flashFel=false});
document.addEventListener('click',e=>{if(S.coMenu&&!e.target.closest('.co')){S.coMenu=false;render()}});
document.addEventListener('keydown',e=>{const typing=e.target.matches('input,textarea,select,[contenteditable]'),mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();S.pal?(S.pal=false,render()):palett();return}
  if(S.pal){const o=opts();if(e.key==='Escape'){S.pal=false;render()}else if(e.key==='ArrowDown'){e.preventDefault();S.palI=Math.min(S.palI+1,o.length-1);render();document.getElementById('palq').focus()}
    else if(e.key==='ArrowUp'){e.preventDefault();S.palI=Math.max(S.palI-1,0);render();document.getElementById('palq').focus()}else if(e.key==='Enter'){e.preventDefault();runOpt(S.palI)}return}
  if(e.key==='Escape'&&(S.modal||S.panel||S.ruta)){S.modal=null;S.panel=null;S.ruta=null;render();return}
  if(typing)return;if(e.key==='ArrowLeft')cyk(-1);if(e.key==='ArrowRight')cyk(1)});
initData();
if(!location.hash||location.hash==='#/moms')location.hash='#/moms/p-'+forvald();
render();
</script>
